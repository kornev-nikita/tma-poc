<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>personality 14 and 17 — conspect</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  /* Тема Telegram с фолбэками для открытия вне TG */
  --bg: var(--tg-theme-bg-color, #ffffff);
  --text: var(--tg-theme-text-color, #1e293b);
  --hint: var(--tg-theme-hint-color, #94a3b8);
  --link: var(--tg-theme-link-color, #2f6feb);
  --sec-bg: var(--tg-theme-secondary-bg-color, #f1f3f6);
  --mark: #fff3b0;
  --indent: 17px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:var(--bg);color:var(--text);}
body{
  font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
  padding:14px 14px 80px; max-width:680px; margin:0 auto;
  -webkit-tap-highlight-color:transparent;
}

/* ── Хлебные крошки (путь до текущего корня zoom) ── */
.crumbs{ font-size:13px; color:var(--hint); margin-bottom:12px; line-height:1.5; }
.crumbs span.c{ color:var(--link); cursor:pointer; }
.crumbs .sep{ margin:0 5px; color:var(--hint); opacity:.6; }
.crumbs .home{ cursor:pointer; }

/* ── Заголовок текущего корня ── */
.root-title{ font-size:20px; font-weight:700; line-height:1.3; margin:2px 0 16px; }
.root-title mark{ background:var(--mark); color:#1e293b; padding:0 2px; border-radius:2px; }
.root-title strong{ font-weight:800; }

/* ── Строка узла ── */
/* line-height маркеров = первой строке текста (24px), чтобы caret/bullet
   сидели ровно на одной высоте с текстом независимо от их кегля */
.row{ display:flex; align-items:flex-start; gap:7px; padding:4px 0; }
.row.node{ cursor:pointer; }          /* вся строка узла кликабельна → свернуть/развернуть */
.caret{
  flex-shrink:0; width:16px; text-align:center; color:var(--hint);
  font-size:12px; line-height:24px; user-select:none;
}
.caret.empty{ visibility:hidden; }
.bullet{
  flex-shrink:0; min-width:18px; text-align:left; color:var(--hint);
  font-weight:700; font-size:16px; line-height:24px; user-select:none;
}
.bullet.zoomable{ color:var(--link); cursor:pointer; }
.txt{ flex:1; min-width:0; line-height:1.5; }
.txt mark{ background:var(--mark); color:#1e293b; padding:0 2px; border-radius:2px; }
.txt strong{ font-weight:700; }
/* Highlightr-цвета (палитра из data.json волта) — конкретный класс перебивает дефолтный жёлтый --mark */
.txt mark.hltr-pink,.root-title mark.hltr-pink{ background:#FFB8EBA6; }
.txt mark.hltr-red,.root-title mark.hltr-red{ background:#FF5582A6; }
.txt mark.hltr-orange,.root-title mark.hltr-orange{ background:#FFB86CA6; }
.txt mark.hltr-yellow,.root-title mark.hltr-yellow{ background:#FFF3A3A6; }
.txt mark.hltr-cyan,.root-title mark.hltr-cyan{ background:#ABF7F7A6; }
.txt mark.hltr-blue,.root-title mark.hltr-blue{ background:#ADCCFFA6; }
.txt mark.hltr-purple,.root-title mark.hltr-purple{ background:#D2B3FFA6; }
.txt mark.hltr-grey,.root-title mark.hltr-grey{ background:#CACFD9A6; }
.txt mark.hltr-green,.root-title mark.hltr-green{ background:#18C3557A; }
.txt mark.hltr-big,.root-title mark.hltr-big{ background:#D4EFED; }
.txt mark.hltr-red-light,.root-title mark.hltr-red-light{ background:#FF558240; }
.txt mark.hltr-purple-light,.root-title mark.hltr-purple-light{ background:#D2B3FF78; }
.txt s{ opacity:.5; }
/* бывшая вики-ссылка [[..]] — некликабельна; сиреневый (accent Obsidian) + пунктир = «была ссылка» */
.txt .wl{ color:#864ffe; border-bottom:1px dotted #864ffe; }
/* одиночные [текст] (категории) — сиреневый как в Obsidian, без подчёркивания (не ссылка) */
.txt .br{ color:#864ffe; }
/* заголовки секций H1..H6 — акцент кеглем/весом, чтобы не теряться среди сотен узлов */
.txt.h1,.txt.h2{ font-size:18.5px; font-weight:800; letter-spacing:-.01em; }
.txt.h3{ font-size:17px; font-weight:800; }
.txt.h4,.txt.h5,.txt.h6{ font-size:16.5px; font-weight:800; }
.row.collapsed > .txt::after{
  content:'…'; color:var(--hint); margin-left:6px; font-weight:700;
}
/* пропуск из документа (пустые строки) → вертикальный воздух перед элементом.
   Пропорционально реальной высоте строки (≈24px): N пустых → N строк воздуха, потолок 3. */
.row.gap1, .leaf.gap1, .divider.gap1, .arrow.gap1, .imgrow.gap1{ margin-top:24px; }
.row.gap2, .leaf.gap2, .divider.gap2, .arrow.gap2, .imgrow.gap2{ margin-top:48px; }
.row.gap3, .leaf.gap3, .divider.gap3, .arrow.gap3, .imgrow.gap3{ margin-top:72px; }

/* стрелка-коннектор → разделитель --- --- ↓↓↓ --- --- */
.arrow{ display:flex; align-items:center; gap:8px; color:var(--hint); font-size:12px; font-weight:700; letter-spacing:.15em; padding:4px 0; }
.arrow::before, .arrow::after{ content:''; flex:1; height:2px; background:var(--hint); opacity:.55; border-radius:1px; }
.divider{ height:2px; background:var(--hint); opacity:.45; border-radius:1px; margin:9px 6px; }
.txt code, .root-title code{ font-family:ui-monospace,Menlo,monospace; font-size:.92em; background:var(--sec-bg); padding:0 3px; border-radius:3px; }

/* картинка-узел (выровнена под текст: caret+bullet+gaps) */
.imgrow{ padding:6px 0 6px 48px; }
.imgrow img{ display:block; width:100%; max-width:300px; height:auto; border-radius:10px;
  border:1px solid var(--sec-bg); cursor:zoom-in; }
.imgrow figcaption{ font-size:12.5px; color:var(--hint); margin-top:6px; line-height:1.4; }

.children{ margin-left:var(--indent); }

/* подсказка снизу */
.tip{ position:fixed; left:0; right:0; bottom:0; background:var(--sec-bg); color:var(--hint);
  font-size:12px; text-align:center; padding:8px 12px; line-height:1.4; }

/* lightbox для картинки */
.lb{ position:fixed; inset:0; background:rgba(0,0,0,.85); display:none;
  align-items:center; justify-content:center; padding:20px; z-index:50; cursor:zoom-out; }
.lb.on{ display:flex; }
.lb img{ max-width:100%; max-height:100%; border-radius:8px; }

/* тулбар действий (прилипает сверху при скролле) */
.toolbar{ position:sticky; top:0; z-index:10; background:var(--bg);
  display:flex; gap:8px; padding:10px 0 8px; margin-bottom:4px; }
.toolbar button{ font:inherit; font-size:13px; color:var(--link);
  background:var(--sec-bg); border:none; border-radius:8px;
  padding:7px 12px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
.toolbar button:active{ opacity:.55; }
</style>
</head>

<script>
// ── Дерево «злого куска» (personality 15.md, стр 24–43). Текст ДОСЛОВНЫЙ. ──
const TREE = {"text": "personality 14 and 17", "children": [{"text": "being_becoming model", "heading": true, "level": 2, "children": [{"text": "1. Complex symbolic value laden systems (strategies of w_to_do = being_becoming model → derived by cultural evolution)", "heading": true, "level": 3, "gap_before": 1, "children": [{"text": "a.  Why complex symbolic systems? Because they intrinsically answer stated questions", "heading": true, "level": 5, "gap_before": 1, "children": [{"text": "`→→→` <mark class=\"hltr-red-light\">Here will be MoM part</mark> `←←←`"}, {"text": "Definition of transcendent / deep / religious", "children": [{"text": "You have concepts and some of them are dependant on some of other concepts more, than on other → you get a hierarchy / network of dependancy", "children": [{"text": "Definition of a deep concept"}, {"text": "Principles of a person — are deep concepts of this person"}]}, {"text": "IF A CONCEPT FROM THE TOP OF THE HIERARCHY IS TOUCHED / THREATENED — YOU GET AN INTENSE EMOTION (EXITEMENT OR APPREHENSION)"}, {"text": "What is transcendent / deep / religious is what is most deep"}, {"text": "The same goes for science — there're fundamental theorems in science"}]}, {"divider": true}, {"text": "1. Humans use symbolic structures / models `1.` to represent reality and then `2.` to find out \"what they can become\" and \"what to do to become it\""}, {"text": "2. Symbolic model that represents \"what I can become\" and \"what to do\" is a **STORY**. Stories are essentially large scale language-based systems of imitation", "children": [{"text": "You look at the world through this story ↓"}, {"text": "**A - actions - B** (wher B is better then A)", "children": [{"text": "You sometimes bring these two together through thinking BUT **==mostly you do it trough action==**"}, {"text": "\"I was here (A), I want or need to go there (B); I did this (A→B); I came there (B)\""}, {"divider": true}, {"text": "Story is the way to express the weights of your inner LLM"}]}, {"text": "it's the most basic story you are embedded in. And this is the story of value. Its value laden framework"}, {"divider": true}, {"divider": true}, {"text": "1. Behavioral space is where evolutionary competition btw strategies occurs"}, {"text": "2. The strategies that'll work consistenty across time in a social organization have to be the functions of iterated reciprical interactions btw people (that's what defines a society)"}, {"text": "3. Those all are layed out and tested through behavioral cooperation and competition"}, {"text": "4. There's a mapping function (it can map those strategies) — this function is a **story**", "children": [{"text": "Those stories has levels of generality and specificity", "children": [{"text": "If you told your story — it will be specific to your time and space (and context of your life). But it will also be the variant of the broader story that is applicable to all people in somewhat similar situation"}]}, {"text": "`bees has stories too`", "children": [{"text": "Bees have a proto-language (highly complicated system of communication to tell where the nectar is)", "children": [{"text": "1. They find a flower, they roll themselves in a nectar of the flower, then come back"}, {"text": "2. They throw this nectar at the center of the hive (procudes smell, attracts attention)"}, {"text": "3. Then they dance (dance goes at a straight line, then curves back):", "children": [{"text": "there're two aspects of the dance (essentially a vector)"}, {"text": "1. Length of the dance: every second represents a 1000 meters"}, {"text": "2. The curve indicates the angle of the flower from the direction of the sun"}]}, {"divider": true}, {"text": "Fascinating that some bees can lie during this process"}]}]}]}, {"text": "5. ==Strategies== of behaviour that best instantiate the most positive possible reputation in the minds of other people ==become deep and religious==", "children": [{"text": "These strategies of behaviour are **ideals** of these classic stories — Gods"}, {"text": "`bees has The God too`", "children": [{"text": "For bee the god is flower"}, {"text": "For bat the god is big fat mosquito"}, {"text": "==For human the god is a pattern of behaviour that best instantiates the most positive possible reputation in the minds of other people=="}]}]}]}, {"text": "3. The most profound ones (which are the most evolutionary useful for survival) are <mark class=\"hltr-green\">deeply integrated into our most basic perception and action models</mark>", "children": [{"text": "There are only two main biological reasons for people to collaborate", "children": [{"text": "1. Genetic similarity"}, {"text": "2. **==Value that's created through the reciprocity==**"}]}, {"text": "Putting aside the 1st reason and focusing on the 2d = being super-effective (West's culture)"}, {"text": "Preconditions for this non-kin reciprically altruistic relationships with value creation are classic strategies / stories / patterns of complex social interaction", "children": [{"text": "There's a pattern of complex social interaction that iterates best across time in an uphill direction and that can have stable and emergent structure (viewed over a sufficiently long period of time)"}, {"text": "That's the intrinsic ethos"}, {"text": "Enablers of relationship btw 2 people", "children": [{"text": "Willingness to tell each other the truth"}, {"text": "Aim at a mutually desirable goal"}, {"text": "Continue doing that across time"}]}]}, {"text": "The intrinsic ethos of the political and economic organizations is most effectively captured by the founding documents of the US", "children": [{"text": "American constitution has solved it (imperfectly but quite effectively), this is american idea", "children": [{"text": "Meaning: founding fathers were able to formulate a set of rules which served as an MVP for functional society"}, {"text": "Which in term resulted in unbelivable productivity of American society for a hundreds years to come"}]}]}, {"divider": true}, {"text": "If you encounter smth unknown on the boundary you use IMAGINATION to imagine what it might be", "children": [{"text": "Known / Unknown / Boundary btw"}, {"text": "Your imagination plays on the boundary"}]}]}, {"text": "4. Complex symbolic systems — namely **==MYTHS==** and **==RELIGIOS SYSTEMS==** — are the aggregations of this symbolic models (stories). They are essentially the oldest and biggest databases of stories"}, {"text": "5. Each complex symbolic system has <mark class=\"hltr-green\">The Ideal</mark> at the top of it's value hierarchy — these are essentially <mark class=\"hltr-green\">an ultimate strategies for survival</mark> offered by each symbolic system", "children": [{"text": "Religious stories is generally the stories about tragedy and redemption", "children": [{"text": "1. Here's most brutal thing that can happen to you"}, {"text": "2. Here's a theory about mode of being that can help you adress that (usually this is a description of an ultimate ideal: Christ, Buddha, Muhammad)"}]}]}, {"text": "6. **Myths, Religions and other ancient symbolic systems** are practically the oldest and biggest psychological theories `(what the person could be & how to get there)`", "children": [{"text": "How exactly are complex symbolic systems connected to the psychology and psychiatry?", "children": [{"text": "1. If you a psychiatrist people come to you shattered and unable to ORIENT THEMSELVES or to FIND MEANING (what is worth **doing** / on what to pay **attention**). They are struggling with their mental health", "children": [{"text": "\"unable\"", "children": [{"text": "If you reacting to stress / chaos / loss in a way that's causing MORE of that — it's a situation where the intervention is needed"}]}, {"text": "shattered, unable to find meaning", "children": [{"text": "\"Why live when my wife dies and all of happiness in my life were predicated on her presence?\""}]}]}, {"text": "2. Good clinitians' job is to help people find meaning during crisis", "children": [{"text": "Before the psychoteraputic revolution people consult about these problems with priest and a philosopher. BUT psy doctor often doesn't have this nessesary competence", "children": [{"text": "That's the part of a broader problem of collapse of the sacred into the profane"}]}]}, {"text": "3. Orientation, meaning and mental health are intrinsically connected and are almost equal to **idea of the ideal**. As a psychiatrist you need to **deeply** understand the idea of mental health hence the idea of the ideal", "children": [{"text": "Mental health is not at all mental. It's not inside. It's in the real world, in the connections with people (existentialism)"}]}, {"text": "4. ==Ancient symbolic systems are systems where the idea of the ideal emerged=="}, {"text": "5. If you want to DEEPLY understand western notion of the the ideal person you have to look at structure of the systems western civilisation grow out of"}, {"text": "6. Western civilisation has it's roots in christianity, and christianity — in older religion structures"}]}, {"divider": true}, {"text": "Connections to Psychological theories", "children": [{"text": "Model of classification derived from myths (Nature, Individual, Culture) maps nicely on Freud's model (Id, Ego, SuperEgo)"}, {"text": "Judaism (jewish religion) — Freud"}, {"text": "Christianity — Jung, Rogers"}]}]}, {"text": "7. The most developed classical symbolic systems are", "children": [{"text": "1. The ancient myths and fairy-tails (especially The Egiptian myths)"}, {"text": "2. Biblical corpus and derivative religions (western civilisations)", "children": [{"text": "1. Judaism"}, {"text": "2. Christianity"}, {"text": "3. Islam"}]}, {"text": "3. Daoism (eastern civilisations)", "children": [{"text": "Buddhism `(derived from Daoism)`"}]}]}, {"text": "8. And the other ancient symbolic system that's relevant to our questions is Shamanic tradition:", "children": [{"text": "The **Shamanic tradition** is a symbolic representation of the process of learning `(becoming / how to go from A to B)`"}, {"text": "There's core values in a religions (sacred), there're ones that are more agile (shamanic)"}]}, {"arrow": true}, {"text": "**So, complex symbolic systems have an answer to all three questions**"}, {"text": "<mark class=\"hltr-green\">where are you now? who are you? / point A</mark> -questions"}, {"text": "<mark class=\"hltr-green\">where to go / point B</mark> -questions"}, {"text": "<mark class=\"hltr-green\">becoming / how to go from A to B</mark> -questions"}]}, {"text": "b.  Exactly what answers complex symbolic systems give in relation to stated questions?", "heading": true, "level": 5, "gap_before": 1, "children": [{"text": "**Stated questions**", "children": [{"text": "<mark class=\"hltr-green\">where are you now? who are you? (•A)</mark> -questions"}, {"text": "<mark class=\"hltr-green\">where to go (•B)</mark> -questions"}, {"text": "<mark class=\"hltr-green\">how to go from A to B (becoming)</mark> -questions"}]}, {"divider": true}, {"text": "<mark class=\"hltr-green\">where are you / (• A ) // what's the core nature of \"being\" in \"being&becoming\" model</mark> -questions"}, {"arrow": true}, {"text": "1. The most ancient and basic symbolic model (or frame) that represents the reality is **CULTURE & NATURE** (order & chaos)", "children": [{"text": "What is ==Culture==? What characterizes culture? How is it connected to humans?", "children": [{"text": "1. Culture is a number of patterns all people are imitating to get along", "children": [{"text": "1. People fight and disagree"}, {"text": "2. When they disagree they can either ==kill each other== or ==make a ruling how to behave== to not kill each other. This is the way to solve disputes between people", "children": [{"text": "Two people went to the court and asked a judge. \"We've got a serious problem, we don't know how to organise our behaviour in the same space, please judge us and **make a ruling and we will abide by it so there's no fight**\""}]}, {"text": "3. When they make a ruling and these ==rules are aggregating, the Body of law emerges== (this is how English common law evolved | most modern bodies of laws derived from English common law)"}, {"text": "4. ==People are manifesting / mimicing the Body of law in their behaviour== and until they do that other people like them and behave friendly. To the degree that you don't do that, you're poorly trained / poorly sosialized, antisocial or dangerous to society"}, {"text": "5. There're plenty of sets of rules like the Body of law and ==by aggregating them again and again you get THE CULTURE==. This is ==the central pattern of social behaviour== that has evolved for thousands of years ==that everyone is imitating to get along=="}]}, {"text": "2. PEOPLE and CULTURE are inseparable. There's no non-cultural people. Our biological and physiological form presumes that we're going to emerge into the world in a culture and it will inform us as we are developing", "children": [{"text": "Culture is simultaniously the great gift and the great danger because on the one hand it makes you civilized, and on the other — grips you and can be horrible weapon when misused"}]}, {"text": "3. Culture is evolved in social environment", "children": [{"text": "Primary focus of humans is not the material world but social one because interaction with other people were part of our environment for millions of years. So ==brain is set up / evolved== to perceive the world through social lens = ==to classify everithing into social categories==", "children": [{"text": "(that's why we attribute living behavior and motivations to literally nonsense like circles and triangles)"}, {"text": "(that's why importance of status (because if you mess with a primate higher then you in a dominance hierarchy you get hurt)"}]}, {"text": "In other words, the world appears to you naturally in a <mark class=\"hltr-red-light\">living and animated</mark> and personified manner because you evolved around (most of what your brain is processing) social environment"}, {"text": "That's why we come up with ==science== (way to examine things without this social lens) only 500 years ago"}]}, {"text": "4. Culture = known", "children": [{"text": "Known is where things go as you want them to go (culture)"}]}]}, {"text": "What is ==Nature==? What characterizes nature? How is it connected to humans?", "children": [{"text": "1. Nature is that which lurks outside the culture"}, {"text": "2. Nature is the concept (represented in culture) that unites all classes of danger things / not known (new) things", "children": [{"text": "People got sophisticated enough so that instead of predator-1, predator-2 and danger-1, danger-2 they start to abstract that into **classes like DANGER itself**", "children": [{"text": "**Circuits** that help process the class of danger **remains the same** as with concrete predator in front of a person"}]}, {"divider": true}, {"text": "Nature is fundamentally feminine because it's where all the things emerge from"}]}, {"text": "3. **Nature = unknown**", "children": [{"text": "Unknown is where when smth goes out of standard patterns, don't go how you want (nature)"}]}]}, {"text": "Visual representations of Culture & Nature", "children": [{"text": "[[The_Ash_Yggdrasil_by_Friedrich_Wilhelm_Heine.jpg|The Yggdrasil]]"}, {"text": "[[main-qimg-017bb798af0d9119eca7004c13e3e110-lq.jpeg|Kali]] (Goddes from Hindu culture) — represents everything you should fear and run from"}]}, {"divider": true}, {"text": "You can define a living system as the ability to dinamically manage a boundary btw order and chaos to direct sacrifice"}]}, {"text": "These two representations are found in almost every complex symbolic / philosophical system in one form or another", "children": [{"text": "1. Chaos / Nature / Isis / Unknown / Underworld / Queen", "children": [{"text": "[[Feminine is represented as Chaos, Underworld, Nature, Unknown|Chaos, Underworld, Nature, Unknown is represented by feminine]]"}]}, {"text": "2. Order / Culture / Osiris / Known / State / King"}]}, {"divider": true}, {"text": "<mark class=\"hltr-green\">where to go (•B)</mark> and <mark class=\"hltr-green\">how to go there (becoming)</mark> -questions..."}, {"arrow": true}, {"text": "...are about integration of Culture and Nature. Every following system (myths, daoism, shamanic tradition and biblical corpus) has an answer for it."}, {"text": "Let's investigate these answers step by step:"}]}, {"text": "1.1  Myths", "heading": true, "level": 5, "gap_before": 1, "children": [{"text": "2. ==Structure is a pre-condition of existence== (we are structure and order by definition). So the “==out of structure== (out of culture)”-thing (chaos, nature, unknown etc) ==is also pre-condition of existence==", "children": [{"text": "==There always was and will be== \"Chaos and Order / Isis and Osiris / ==Nature== and ==Culture==\"-==dualism=="}]}, {"text": "3. So we need something to ==mediate between them (order and chaos)==. In Egiptian myths this is ==Horus== is the son of Isis and Osiris. And Horus is the ==God of ATTENTION==", "children": [{"text": "\"Egyptian eye\" / \"The Eye of Horus\""}, {"text": "Head of a falcon (can really see and is above everything)"}]}, {"text": "4. Attention is the answer to the question of \"How much order and chaos (structure / out of structure) do you need?\" <br>→ <mark class=\"hltr-orange\">Exactly the amount of chaos</mark> for you to be awake = <mark class=\"hltr-orange\">to pay attention</mark>", "children": [{"text": "1. Perfect order (protected, cozy, no hunger or thirst) → no need for attention → sleep"}, {"text": "2. A lot of chaos → paralyze"}, {"text": "3. Proper answer — \"One foot in order, one foot in chaos\" → <mark class=\"hltr-orange\">Enough chaos</mark> for you <mark class=\"hltr-orange\">to be awake</mark> and <mark class=\"hltr-orange\">to pay attention</mark>", "children": [{"text": "you are developing the fastest if you do that optimally"}]}]}, {"text": "5. Feeling of meaning and maximum attention indicates that you are in proper place"}, {"text": "6. Put yourself in a situation when you ARE PAYING ATTENTION — this is the proper answer to ==\"how to behave\"==-question from ancient myths"}, {"text": "`↑ staying there deeply linked to sanity, hence linked to clinical psychology`"}]}, {"text": "1.2  Daoism [[Def-s#^eha4f5|_]]", "heading": true, "level": 5, "gap_before": 1, "children": [{"text": "7. Definition of Dao", "children": [{"text": "Dao for Daoists is what the things are made of / underlying reality of things / structure of experience"}, {"text": "Dao essentialy means \"meaning\" → meaning is underlying reality"}]}, {"text": "8. Dao is represented by [[yin-yang-order-chaos.jpg|Yin-yang-circle]]", "children": [{"text": "Order and chaos"}, {"text": "Masculine and feminine"}, {"text": "**Thing that you use to perceive reality** (culture) and **the thing that you're perceiving** (nature)"}]}, {"text": "9. The main philosophy of daoists is to balance yin (nature) and yang (culture) properly = <mark class=\"hltr-orange\">so again \"One foot in order, one foot in chaos\"</mark>", "children": [{"text": "This is what [[yin-yang-order-chaos.jpg|Yin-yang-circle]] represents: Dao simbol means meaning → meaning is btw order and chaos"}]}]}, {"text": "1.1+1.2:  main conclusion", "heading": true, "level": 5, "gap_before": 1, "children": [{"text": "Optimal state of existance derived from traditions of **myths** and **daoism** looks like <mark class=\"hltr-orange\">engaged interest with what's going on without too much apprehencion</mark> (≠ 0 apprehencion)", "children": [{"text": "Zone / flow: sufficiently secure but engaged in a game that ensures that security maintains itself across time"}]}]}, {"text": "1.3  Shamansim", "heading": true, "level": 5, "gap_before": 1, "children": [{"text": "This tradition basically **EMBODIES** two of our three questions: <mark class=\"hltr-green\">how to go from A to B (becoming)</mark> and <mark class=\"hltr-green\">where to go</mark> -questions"}, {"arrow": true}, {"text": "10. Firstly, the figure of ==Shaman== symbolically (and often physically — by emodiment) represents: ==the knowledge of the previous generations, the \"potential you\", all the things you could be== (the culture)", "children": [{"text": "Shamsns are oral and embodied repository of traditions of a culture because illiterate cultures has to carry traditions with them in oral or in embodied form (the role of shaman is tens of thousands years old)"}, {"text": "Shaman is a scientist / doctor / priest wrapped up into a one thing"}, {"text": "This were shamans who's supposed to be dealing with realities that's outside of day-to-day e.g.", "children": [{"text": "Spontaneous vocation (призвание)"}, {"text": "Hereditary transmission"}, {"text": "Personal quest"}]}, {"divider": true}, {"text": "[[Losing connection with the culture|\"Lost connection with ancestors' spirits\" really means disrupted continuity of the CULTURE]]"}]}, {"text": "11. And, secondly, in his rituals he embodies and dramatizes the process of becoming (learning)", "children": [{"text": "Shamanic tradition is a dramatization of the process of <mark class=\"hltr-green\">how people learn</mark> — people progress by \"dying and coming back to life\" at different levels"}, {"text": "A shaman is recognized as such only alter having received two methods of instruction", "children": [{"text": "1. **Ecstatic** e.g., dreams, trances, visions", "children": [{"text": "It usually includes usage of pretty similar hallucinogenic substances"}]}, {"text": "2. **Traditional** e.g., shamanic techniques, names and functions of the spirits, mythology and genealogy of the clan, secret language"}]}, {"text": "Core symbolic process of initiation is <mark class=\"hltr-green\">death and rebirth</mark>"}, {"text": "Shamans must incorporate their visions into culture (or he just schizophrenic). They are masters of the visions, not victims"}, {"text": "Shamans are reported to undergo the same types of experiences when they \"do threir thing\"", "children": [{"text": "1. Conscious experience of their own death /  reduction to a skeleton"}, {"text": "2. ﻿﻿Communion with the ancestors"}, {"text": "3. ﻿﻿Climbing the world tree"}]}]}, {"divider": true}, {"text": "Hallucinogenic substances were a technology that was helping them to do this role", "children": [{"text": "One of the hypothesis of the evolution biologists is that mashrooms was one of the main reasons of discovering high level of consciousness", "children": [{"text": "This is an old [[Unknown.jpeg|picture]] suggesting that Eve was feeding Adam with psilocybin \"fruit\""}, {"text": "And [[images.jpeg|this]] is the Christ with psilosybin"}]}, {"divider": true}, {"text": "*Amanita muscaria* (мухомор) — big doses are poisonous, but in microdoses is extremely hallucinogenic", "children": [{"text": "Very common in illustrations especially in illustrations to fairy-tales"}]}, {"text": "Psilosybin"}, {"text": "Ayawaska", "children": [{"text": "The hallucinogenic plant of amazonian shamans"}, {"text": "Ayawaska is made of DimethyItryptamine (DMT) and MAO-inhibitor (inhibitor of DMT) which decreases the rate of breaking down of DMT"}]}, {"text": "Serotonin (5-Hydroxytryplamine, S.HT) — major brain neurotransmitter (helps neurons grow) — is also part of the shamanic hallucinoges"}]}, {"divider": true}, {"text": "↑ `Shamansim connects perfectly to the Jungian Self`"}, {"divider": true}, {"text": "There's core values in a religions (sacred), there're ones that are more agile (shamanic)", "children": [{"text": "There are a hierarchy of repairability in the genome. Some parts of dna is repaired with almost 100% quality, some — not. The same process works for culture"}]}]}, {"text": "1.4  Biblical corpus", "heading": true, "level": 5, "gap_before": 1, "children": [{"text": "Biblical corpus very profoundly answers <mark class=\"hltr-green\">how to go from A to B (becoming)</mark> and <mark class=\"hltr-green\">where to go</mark> -questions"}, {"arrow": true}, {"text": "[[The Gist of Christianity and Biblical corpus]]", "children": [{"text": "1. There should be unifying goal unity. If there's no unity / plethora of goals → it's conflict by definition. Or lack of enthusiasm"}, {"text": "2. What should be unifying goal / what constitutes that unity?"}, {"text": "3. We can say about that unity that it can't be any level below the ultimate reality"}, {"text": "4. This unifying unity is better conceptualized as unifying ultimate [[d_Spirit|spirit]] = set of animating principles that A LOT of people animate simultaniously (hyper meme)"}, {"text": "5. Biblical corpus is attempting to ==firstly== specify the implicit unity by laying out a sequence of narratives. [[00 Classical stories or archetype#Classical myths with God|Each narrative stress a different ultimate Unity]] in <mark class=\"hltr-red-light\">The old testament</mark>", "children": [{"text": "We don't exactly understand the process by which the order of Bibliclal stories came to follow one another. It's smth like collective intuition. But order works. We intrinsicly percieve it as \"yes, it clicks and order is right\""}]}, {"text": "6. ==Then== (from the Christian perspective) there's the culmination in The New testament. The idea of the culmination is that all that spirits described before are the same spirit (spirit of Christ) that makes people voluntarilty confront catastrophic suffering of their life AND IF YOU ACT OUT THAT SPIRIT IT INVERTES THE TRAGEDY. And the more you willing to bear the burden of being voluntarily (and act this spirit out) the less suffering is actually assossiated with that"}]}, {"text": "Symbolic ideas of Christianity", "children": [{"text": "The idea of <mark class=\"hltr-purple-light\">becoming self-conscious about limitations</mark>", "children": [{"text": "Woman offering man a fruit is connected to death **=** ==Discovering / developing of self-consciousness was discovering of DEATH and TIME== — we start to understand full nature of our vulnerability, that life is finite and bounded", "children": [{"text": "Fruits are always appearing in stories because", "children": [{"text": "For a big part of our history we were frugivores (fruit-eaters)"}, {"text": "Fruits are the reason we have colour vision"}]}, {"text": "Men (generally speaking) were hunters, women were gatherers"}, {"text": "Eve offering Adam a fruit means that Eve tempts him into a conscious relationship with him. It's an enticement into **self-consciousness** and sexuality"}, {"text": "Females (namely rejection of males by females) is deeply linked to conscience", "children": [{"text": "When man is rejected it reveals to him it's flaws"}]}, {"text": "Adam finds himself naked when he became self-conscious", "children": [{"text": "Nakedness is connected to upright walking"}, {"text": "Other animals walks on 4 legs → spine and bones are their shield. Humans has all their vulnerability (front part of a body) exposed"}, {"text": "Becoming consciousness is basically equivallent to recognising our naked vulnerability"}, {"text": "Covering youself up is the first indication that you're aware of your vulnerability"}]}]}, {"text": "↑ This was qualitative transformation in the nature of experience. The idea of Genesis is that we are fallen creatures because we have woken up and are aware of our vulnerability. It makes us alienated from existance (unlike other animals)", "children": [{"text": "Symbolic representation of this qualitative transformation is transition from heaven to Earth"}, {"text": "Being in heaven IS BEING UNCONSCIOUS"}, {"text": "Being on Earth is understanding that you're mortal and need to care about yourself and work"}]}]}, {"text": "The idea of <mark class=\"hltr-purple-light\">The Ideal that will transcend this limitations when incorporated</mark> ([[tumblr_omx522sqbp1vjov3vo1_1280.jpg|picture]])", "children": [{"text": "To ==transcend catastrophe==, mortality and suffering you ==must find the ideal and incorporate it==. And the ideal is ==voluntary dying and resurrecting entity== (entity that's continually transform)", "children": [{"text": "These small things on the left with the crusifiction are hosts (part of Christ's body) and eating them is kind of cannibalistic ritual. This is really old idea: if in the face of tragedy you can identify true ideal and incorporate it (eating is the most basic representation of incorporating) it will be an antidote to catastrophe"}, {"text": "Hosts are made of weat and weat is connected with resurrection (disappear in the fall and comes back in the spring). It's like phoenix. Dying and resurrecting corn God"}]}]}, {"text": "The idea of <mark class=\"hltr-purple-light\">consciousness as the divine quality that continually extract order from chaos</mark>", "children": [{"text": "God makes humans and says. Both of you are made in the image of God. It may mean that God has 2 arms and 2 legs, but more accurately it means that all that it is that makes you conscious has this divine quality and is able continually extract order from chaos (and by doing that — interacting with the world — humans are bringing about the creation of reality)"}]}]}, {"divider": true, "gap_before": 4}]}]}, {"text": "2. Theories of philosophy and psychology (theories of w_to_do = being_becoming model → formalized by practical scientists)", "heading": true, "level": 3, "children": [{"text": "a. These theories are the models of \"what to do\" formalized by practical scientists: psychologists and philosophers", "heading": true, "level": 5, "gap_before": 1, "children": [{"text": "==Theories of philosophy and psychology== are bodies of knowledge that stand **between** [complex symbolic systems] that have appeared based on randomness and evolution (archetypes as cross-cultural memes), **and** [strict biological theories] that were derived on the basis of the scientific method", "children": [{"text": "Philosophy and psychology are a part of science — meaning the theories need to be as strict as possible"}, {"text": "But also their goal is making suboptimal being optimal hence they need to take into account the category of \"subjective\" and the issue of \"value\" — need to tell what to do"}]}, {"text": "These theories were the first comprehensible and successful try to **practically** and **scientifically** formalize the <mark class=\"hltr-green\">optimal model of \"being & becoming\"</mark>"}]}, {"text": "b.  Key problems and research areas", "heading": true, "level": 5, "gap_before": 1, "children": [{"text": "To research \"being & becoming\" you must"}, {"text": "Investigate `what is being`, what it's core nature looks like", "children": [{"text": "Being&becoming consists of[[The MODEL#^yny2eq|_]] physical part and psychological-<mark class=\"hltr-grey\">social</mark> part"}]}, {"text": "Investigate the optimal conceptual model of becoming"}, {"arrow": true}, {"text": "12. <mark class=\"hltr-orange\">Constructivists</mark> (Piaget) were trying to formalise the connection btw development of psychological part of `being` and individual's behavior (down to motor actions) → were trying to scientifically derive culture`←→morality` (social part of being) as an emergent property from repeated individual interactions"}, {"text": "13. <mark class=\"hltr-orange\">Depth psychologists</mark> (Freudians and Jungians) researched  the `psychological part of being` and proposed the \"basic vectors\" of this \"set\" — kind of **grammatical structure of being**"}, {"text": "14. <mark class=\"hltr-orange\">Phenomenologists & existentialists & rogerians & Jung</mark> tried to find out ==what models of conceptualising of being&becoming are the most optimal== / lead from sub-optimal being to optimal", "children": [{"text": "such models of conceptualising of being&becoming that outweigh the intrinsic tragic element of life"}]}, {"arrow": true}, {"text": "After we've briefly described the research object for each school of thought, we need to deeply understand the conclusions and underlying models each theory has come to", "children": [{"text": "Инсайт относительно stated целей (оптимальной модели поведения или, например, что есть being)"}]}]}, {"text": "2.1  Constructivists (Piaget)", "heading": true, "level": 5, "gap_before": 1, "children": [{"text": "Constructivists answer <mark class=\"hltr-green\">\"Who we are? How we came here? Point A\"</mark> -questions <br>and a <mark class=\"hltr-green\">\"becoming / process of going from A to B\"</mark> -questions"}, {"arrow": true}, {"text": "**==Constructivists (Piaget)==** explains how the individuals **construct** themselves from nothing"}, {"text": "Piaget derived a theory of <mark class=\"hltr-green\">how exactly are we psychologically become who we become</mark> ==(develomental psychology)=="}, {"text": "**And** explored / scientifically defined the ==basis for emergent morality== (which <mark class=\"hltr-red-light\">means that</mark> optimal \"being & becoming <mark class=\"hltr-red-light\">model</mark>\" <mark class=\"hltr-red-light\">can be derived</mark>)", "children": [{"text": "As you organise your body (from the spine up) the manner in which you organise your capability for action and perception is continually modified by interaction with other people — your \"socialized being\" is build right into your motor circuitury = morality is build into your nervous system"}, {"arrow": true}, {"text": "Non-arbitrary high-level of abstraction comlpex system of human interactions — morality — is emergent from local games / interactions btw people as is a mechanism that's required to effectively regulate interactions of multiple people across multiple occasions"}]}, {"arrow": true}, {"text": "**Humans construct all their higher cognitive and social structures from the level of actions**", "children": [{"text": "Piaget considered himself genetic [[00 Epistemology|epistomologist]] (theory of valid knowledge and knowledge per say) → he studied ==1. the knowledge itself unfolded across time== and the ==2. development of cognitive structures across time== (that's used to process this knowledge)"}, {"arrow": true}, {"text": "1. Constructivists came to the conclusion that the real \"knowledge\" is a process not a state", "children": [{"text": "1. The common postulate of various traditional [[00 Epistemology|epistemologies]] is that ==knowledge is a fact== (learn number of facts → gain some knowledge) and ==not a process=="}, {"text": "2. ==But that's wrong==. Facts are not static. [[Facts ≠ truth. They are tools for the process of knowledge generation|Facts ≠ truth or knowledge]]"}, {"text": "3. Then <mark class=\"hltr-green\">What is knowledge?</mark> / How are the various types of knowledge possible if facts are not static and will change over time?"}, {"text": "4. The answer is that <mark class=\"hltr-green\">knowledge is a process not a state</mark>", "children": [{"text": "The real (unchangable) fact is that we are always in the process of learning \"facts\""}]}, {"text": "5. And humans are information-foraging-machines. ==Constructivists studied the process of acquiring the information== (<mark class=\"hltr-green\">this process is knowledge</mark>)", "children": [{"text": "The facts you know matter less then the process by which you acquire them", "children": [{"text": "\"There is no structure apart from construction, either abstract or generic\" (про то, что факты нестабильны)"}]}, {"text": "\"Knowledge does not begin in the l, and it does not begin in the object; it begins in the interactions.... There is a reciprocal and simultaneous construction of the subject on the one hand, and the object on the other\""}]}]}, {"text": "2. Hence to study [knowledge] one need to study [the process of acquiring knowledge by humans]", "children": [{"text": "<mark class=\"hltr-green\">This process</mark> can't exist without the [object (you)] and [the source of information (nature)] → Pre-contitions of constructivism are 3 things that exist: <br>**a.** You (biology + culture), **b.** Nature, **c.** Process of acquiring information", "children": [{"text": "1. Structure of YOU (culture + biological complexes that allow you to percieve things)"}, {"text": "2. The source of all information (nature)"}, {"text": "3. The process that's YOU = [you using your appendages and senses to interact with things and to make them manifest new properties]"}]}, {"divider": true}, {"text": "**There are two types of acquiring information**:", "children": [{"text": "1. Just adding new information — ==assimilation== (using the existing knowledge and frameworks; when information is not revolutionary for your existing knowledge structure)"}, {"text": "2. Adding REALLY NEW and revolutionary information hence rebuilding (killing) your old structure of knowledge — ==accommodation== (developing new frameworks)", "children": [{"text": "When a baby becomes a master at crawling it reaches an equilibrium on this stage of development. Most of the time WHAT IT WANTS TO HAPPEN HAPPEN"}, {"text": "When it discovers walking, the whole structure of knowledge (crawling related) is no longer really relevant. That's a new stage — walking — and the ability to walk is an information that constitutes revolution in knowledge structure", "children": [{"text": "Walking"}, {"text": "Toddler to baby"}, {"text": "Riding a bycicle"}, {"text": "Puberty"}, {"text": "etc."}]}]}, {"divider": true}, {"text": "Science development are divided into the same two types of discoveries. **Normal** (assimilation) and **Revolutionary** (accommodation)"}]}]}, {"text": "3. The key insight / most distinctive feature of the <mark class=\"hltr-green\">process of acquiring information</mark> or <mark class=\"hltr-green\">knowledge</mark> is that it goes **[[We build high abstractions from the bottom up, from physical actions|FROM THE BOTTOM UP]]** <br>`or`<br>Humans learn to acquire information and then develop higher and **higher abstractions** from the **level of actions**"}]}, {"text": "**Consequences <mark class=\"hltr-red-light\">(main insights)</mark> from these theory**", "children": [{"text": "1. First, ==Knowledge is emerging from action==. ==Understading really means mapping an objects onto our body== so meaning only relevant if you have a [[Embodied cognition|body]]", "children": [{"text": "[[Humans percept through narrative or story → ethics is implicit|We have no other way]] of describing living in time other than the set of actions (narrative)"}, {"divider": true}, {"text": "Problems", "children": [{"text": "Number and space"}, {"text": "Time and speed"}, {"text": "Permanent objects, identity, and conservation"}, {"text": "Chance"}, {"text": "Moral concerns"}, {"text": "Play patterns and dreams"}, {"text": "Imitation of others"}]}]}, {"text": "2. Second, ==Higher-order [[00 Morality|morality]] is an emergent property of repeated social interactions (repeated games)==", "children": [{"text": "1. Piaget studied children and how they interact"}, {"text": "2. Games between children happens ==without children explicitly know the rules==", "children": [{"text": "[[d_Playing|Playing a game]] is about imitating"}, {"divider": true}, {"text": "[[00 Imitation#^gd4oml|Language allows you to imitate across space and time]]"}, {"text": "1. Only later in development children become explicitly conscious of the rules", "children": [{"text": "(and are very irritated when someone breakes them)"}]}, {"text": "2. And only then later in development they start to understand that the rules can be adjusted by mutual agreement"}]}, {"text": "3. The rules are gradually being encoded in their interpersonal behaviour (on the level of actions) and in their patterns of actions across time. Meaning **==learning of the rules is going through the interpersonal (social) correction for \"allowable\" / \"not allowable\" behaviour==** and this correction occurs on the level of actions", "children": [{"text": "If a child know what is \"allowable\" and \"not allowable\" — he is [[Process of children socialization|well socialized]]"}, {"text": "Games teach you to lose", "children": [{"text": "That you can lose"}, {"text": "That you can lose gracefully"}, {"text": "That you can lose and congratulate the winner"}, {"text": "And that you can stand up and proceed playing to get better"}]}]}, {"text": "4. This model is valid not only for games between children but for every social interaction (from a mother socializing her infant to not bite to the society socializing it's member to respect the elders)"}, {"text": "5. So by the time the child is three years old, he encoded in his behaviour the morality of the society he lives in"}, {"divider": true}, {"text": "Here are **[[Games are microcosms of the world & emergent morality|Piagetian stages of development]] of higher order morality**"}, {"divider": true}, {"text": "Reputation is the most efficient and also emergent metric / function in a social group", "children": [{"text": "Movement towards a goal is intrinsically rewarding"}, {"text": "Movement towards an ethical (good) goal is emergent", "children": [{"text": "People live with people = in social environment = repeated interactions / need to exchange of the result of specialized labour → Ethics is emergent from iterated exchanges and iterated communications"}, {"text": "Goal of destruction and hurting other people is very hard to sustain becasuse of repeatedness"}]}, {"text": "Reputation is the most efficient and also emergent metric / function in a social group", "children": [{"text": "Reciprocity bank ←→ reputation", "children": [{"text": "Mammoth and meat"}, {"text": "One of Christ injunctions: store the gold on heaven, not on earth (reputational integrity)", "children": [{"text": "Christ’s worst enemies in the gospels are the people who gain unearned reputation"}, {"text": "↑ virtue signaling"}]}, {"text": "Bible → eternal view → repeated game"}, {"divider": true}, {"text": "generosity → storing the value in goodwill of other people"}]}]}]}]}, {"text": "3. Third, the ==highest stage of development is equilibrated state==. When all the models — from the level of action to the level of highest abstraction — are integrated"}]}]}, {"text": "2.2  Depth psychologists (Freud, Jung)", "heading": true, "level": 5, "gap_before": 1, "children": [{"text": "**==\"Depth psychologists\"==** also dug deep into the <mark class=\"hltr-green\">\"Who we are? How we came here? Point A\"</mark> -questions", "children": [{"text": "They were ==studying the unconscious== to explore the grammatical structure (alphabet) of being; trying to come up with ==what is common to the experience of sets of people==", "children": [{"text": "Unconscious is everything prior to articulation (→ subpersonalities)"}, {"text": "To find the alphabet of being that you need to deal with the darkest sides of human psyche"}, {"text": "Real people are messy and really weird"}, {"text": "Psychoanalytics is not liked by clear minded scientists, but these scientists are not even close to what real people are like"}]}]}, {"text": "Then Jung in particular integrated the answer to the question of <mark class=\"hltr-green\">what to do / the optimal model of being&becoming</mark>"}, {"arrow": true}, {"text": "1. <mark class=\"hltr-orange\">Depth psychologists</mark> (Freudians and Jungians) researched  the `psychological part of being` and proposed the \"basic vectors\" of this \"set\" — kind of **grammatical structure of being** / what is common to the experience of the sets of people (F: drives → J: archetypes)", "children": [{"text": "Freud researched people and their hidden personalities `(psychological part of being)`. He came up with drives as a source of these hidden personalities and classification (id, ego, super-ego) as a [[00 Sigmund Freud#^hpata7|model]] of the psychi. This still a very usefull model. Here's why", "children": [{"text": "Pshychoanalysis is scientifically regarded as effective treatment and is at least as or more effective then other pshychotheraputic schools", "children": [{"text": "[[00 Sigmund Freud#^hpata7|Basic Freudian models]]"}]}, {"text": "It has several key ideas that are very up-do-date like", "children": [{"text": "[[You consist of many sub-personalities]]"}, {"text": "Psychiatric classificastions are not purely scientific classifications. It's also about morality because it psychiatry tries to make the patient's condition **better**"}, {"text": "Idea of [[Catharsis|catharsis]] is relevant with some caveats — modern researches reveals that it's not merely about expression of emotions but about ==verbalization== and creating a coherent representation in your head"}, {"text": "[[Sexuality and agression are hard to integrate in social structure|Sexuality and agression]] are really one of the hardest \"drives\" to integrate in social structure (but they are not the only one as Freud suggested)"}]}, {"text": "And the main conclusion is a very relevant one: ==functioning personality is a model that integrates==", "children": [{"text": "all of the fundamental drives inside (as to which is going to take priority when and under what condition)", "children": [{"text": "Like integration of", "children": [{"text": "[[00 Resentment#^m8f9id|agression]]"}, {"text": "[[Sexuality and agression are hard to integrate in social structure|sex]]", "children": [{"text": "[[00 Sigmund Freud#^aef941|Why was Freud concentrated on sex?]]"}]}]}]}, {"text": "other individuals"}, {"text": "groups of people"}]}]}, {"text": "Jung build on Freud's knowledge and ==researched== drives/archetypes/memes (unlike Freud he don't deny religions and myths) of `(psychological part of being)` and proposed a [[Jungian Archetypes — mythological kingdom as the representation of the psychie|system of archetypes]] ([[The Story of Lion king|here's Jungian Lion king analysis as an example]]) to represent the psychi", "children": [{"text": "Take [Jungian analysis of archetypes], add [Piaget's emergent morality] and you get ==**the model of the Emergence of a religion**==", "children": [{"text": "1. ==You are evolutionary attracted to an ideal== because you want to know how to behave", "children": [{"text": "The more ideal other person is the more interesting he is to you because you want to know how to behave to become interesting"}, {"text": "High status people are interesting"}]}, {"text": "2. ==You are precisely tuned to be able to read off people's interest== to find out you're deviating from the ideal (and these people don't even know what an ideal is, it's just something that their attention is drawn) ([[Games are microcosms of the world & emergent morality|emergent game rules — Piaget]])"}, {"text": "3. ==You project your ideal on other people==", "children": [{"text": "E.g. you may not know what an ideal of woman for you, but you have it unconsciously even it's not formulated. Then you projecting this ideal on your partner unconsciously by showing negative reaction to something he or her do"}]}, {"text": "4. Obviously this is projection of YOUR PERSONAL ideal **but** every person does it. ==When you average 10000 personal ideals you get THE IDEAL=="}, {"text": "5. Once in a while there is a person who acts like that (Jesus, Buddha etc.)"}, {"text": "6. Then you have a religion"}, {"text": "Religions are not conscious constructs. Conscious constructs last 50-100-150 years. Religions keep civilisavions goind for thousands of years", "children": [{"text": "The problem with the enlightment mentality", "children": [{"text": "1. Religion was conceptualized as a scientific theory which it isn't"}, {"text": "2. And God was conceptualized as a caricature of the inefable and dismissed"}, {"text": "3. Both of it is not accurate"}]}]}]}, {"divider": true}, {"text": "Desctiption of archetypes using biological analogues", "children": [{"text": "Archetype is like a \"shoulder\" in a baby's (arm → shoulder → forearm → palm → fingers...) motor development / rough [[The MODEL#^cpxr1o|shape of anty-body]] (that can grab a lot of bacterias)", "children": [{"text": "The same principle as with a child who learns to grab things (arm → arm and elbow → arm and elbow and wrist → arm and elbow and wrist and fingers → etc.)"}]}, {"text": "Proclivity / capacity to remember specific stories is like a library of antybodies"}]}]}]}, {"text": "2. Then Jung integrated Freud's insights + Myths + Religions and came up with coherent conceptualisation of <mark class=\"hltr-green\">\"what to do\"</mark>-question (Phoenix / SELF)", "children": [{"text": "==Jungian answer to Death of God (defined by Nietzsche)== is a successful try to formalise the coherent conceptualisation of <mark class=\"hltr-green\">\"what to do\"</mark>-question that **will not lead** to [Nihilism/Totalitarianism] and **will lead** to [transition from sub-optimal being to optimal]"}, {"text": "Nietzsche stated [[\"Death of God\" — def of problem and solution|The Death of God]] problem", "children": [{"text": "He believed that western civilisation is based on the conception of the divinity and with the discovery of science and disintegration of divine it will lose the unifying cultural foundation"}, {"text": "He predicted that Death of God will lead to [replacement of this unifying foundation] with ==1. Nihilism== (nothing is at the pinnacle of value structure) on the one hand and ==2. Totalitarianism== (state is on the pinnacle) on the other", "children": [{"text": "Nihilism", "children": [{"text": "Goethe's answer for what motive human evil and evil in general has: \"Life is so unbearably cruel and random and tragic that it would be better if it had never existed at all"}, {"text": "Postmodernism is modern Marxism"}]}, {"text": "Totalitarianism", "children": [{"text": "Nazi and Soviets was the example of putting state before the God"}, {"text": "why communism is flawed from an engeneering perspective", "children": [{"text": "It doesn't scale"}, {"text": "Axiom \"world of complex social interactions can be simplified sufficiently so that centralised planning authority can deal with it\" is wrong. It's computationally impossible to plan it top-down"}, {"text": "Sumtotal of human interactions in a large civilisation is so immense that you need distributed network of cognition in order to compute the proper way forward → you need to give each actor their domain of individual choice so that they can maximise their movement forward and then you derive the aggregate from it for the civilisation"}, {"divider": true}, {"text": "Religion ideas scale. More than that, religion is the record of ideas that scaled"}]}, {"divider": true}, {"text": "Totalitarianism is FALLING IN LOVE WITH THE WAY YOU ==REDUCE / NARROW THE WORLD ALLIED WITH FORCE=="}, {"text": "==Power is about not listening, not making a fair exchange=="}]}]}]}, {"text": "Jung was trying to resolve the problem above", "children": [{"text": "He was trying to come up with idea of how to not fall into Nihilism / Totalitarianism and what should replace the divine"}]}, {"text": "And he did it ↓"}, {"text": "Jung's answer is ==**[[00 Jungian SELF = Phoenix as an ideal of order and personality|Phoenix]] as an optimal model of conceptualisation of being**== and **==the full integration as the higher the level of moral development==**", "children": [{"text": "Union of rationality with emotions and motivations (masculine spirit + feminine emotions + motivations / integration of the shadow)"}]}]}]}, {"text": "2.1 + 2.2:  main conclusion", "heading": true, "level": 5, "gap_before": 1, "children": [{"text": "17. **Piaget** — integration of body and higher level abstractions (equilibrated state)"}, {"text": "18. **Freud** — integration of rationality with unconscious sexual and agression drives"}, {"text": "19. **Jung** — integration of rationality with **all** emotions and motivations (masculine spirit + feminine emotions + motivations / integration of the shadow)"}, {"text": "**Combined this is the model of integration btw mind, spirit and the real actions of your body**"}, {"arrow": true}, {"text": "NEXT STAGE IS the integration of mind, spirit, actions, **==and the broad environment around you==** — this the idea of Phenomenologists"}]}, {"text": "2.3  Phenomenologists → existentialists", "heading": true, "level": 5, "gap_before": 1, "children": [{"text": "**==Phenomenologists → existentialists==** + again **==Jung==** `(he was like imba)` attempted to solve all three <mark class=\"hltr-green\">stated problems:</mark>", "children": [{"text": "1. They tied together internal problems and external ones — proposed the deep explanation / expanded definition of the current state (<mark class=\"hltr-green\">where you are and why you are here</mark>)", "children": [{"text": "Because life itself poses a paradoxical problems and questions to you (because you're self-conscious) suffering and tragedy will always be a part of being human (if you're human — you're sick by definition)", "children": [{"text": "1. Living when you're **1. vulnerable** and **2. mortal** [nature]", "children": [{"text": "Suffering"}, {"text": "Living when other die"}, {"text": "Randomness of life, world, genetic processes"}, {"text": "Etc."}]}, {"text": "2. Dealing with constant evaluation from others (society and history are always a judge) [culture]"}, {"text": "3. Dealing with yourself and **your transformations** [inner self]"}, {"divider": true}, {"text": "Experience itslef is so irrational given it's suffering and it's absurdity that a merely rationally formulated representation of life is insufficient — it can't manage the job. And rationality will cut away parts of life that it can't incapsulate <br>Human beings don't want utopia. We're to insane for that <br>(с) Dostoevsky"}]}]}, {"text": "2. Defined / explained where the optimal state is = Proposed the solution for problem of <mark class=\"hltr-green\">where to go and how to do it properly</mark>", "children": [{"text": "The optimal meaning of life (the optimal model of attention) is the pattern of thoughts and actions that you take that enables you to (at least) tolerate (→ or even welcome) the (tragic) conditions of life", "children": [{"text": "(tragic) conditions of life from p.1"}]}]}, {"text": "3. And stated that this is your responsibility to go there"}, {"divider": true}, {"text": "**Phenomenological humanism** / Rogers, Binswanger & Boss"}, {"text": "**Existentialism** / Frankl, Nietzsche, Dostoevskiy, Solzhenitsyn, Kierkegaard"}]}, {"arrow": true}, {"text": "**The phenomenological perspective** (1. reality is best concieved as a totality of your experience; 2. Possibility shines through structure with meaning)", "children": [{"text": "1. **Phenomenologists** proposes that <mark class=\"hltr-red-light\">reality / being is best concieved as a totality of your experience</mark> (emotions, motivations, bodily sensations etc.)", "children": [{"text": "Subject / object dichotomy is not that important from the level of individual"}]}, {"text": "2. And totality of your experience includes your environment and relationships. The concept of YOU is much broader then just your personal experience"}, {"text": "3. They called the totality of your experience, this concept of you — [[Dasein]]"}, {"text": "4. [[Dasein]] has elements of being (now) and **becoming (future)**: \"Future is already here\" because your current behavior is based on it"}, {"text": "5. ==The focus of attention== (free will) and the manner in which the world manifests itself are integrally related", "children": [{"text": "Ex. 1: If you pass the exam, are waiting for grade and...", "children": [{"text": "... expect A, then B is disappointing"}, {"text": "... expect C, then B makes you happy"}]}, {"text": "Ex. 2: If you are walking into auditorium...", "children": [{"text": "... with intention to seat — you will see chairs"}, {"text": "... with intetion to clean it — you will see things that're out of place"}, {"text": "... and you're lonesome — you will see potential partners"}]}]}, {"text": "6. **==You bear a of responsibility for the ongoing quality of your experience. It's build into the nature of being. There's no way out of it==**"}, {"text": "7. Proper way \"to listen\" to your experience (to use free will) is deeply connected with attention: you need to explore what \"shines forth\" / has meaning for you", "children": [{"text": "\"Phenomenon\" (`tr.:` \"shine forth\") → smth that grips your attention"}, {"text": "Paying attention to meaningful things = updating your model = keeping up with nature / environment"}]}, {"text": "8. What is meaningful? Smth you can't escape from & smth that draws your attention and actions", "children": [{"text": "Phenomena of meaning is one of key subjects of exploration for Phenomenology"}, {"text": "Something is meaningful when it's self-evident / when you can't escape from it"}, {"text": "For materialists it is facts, but for phenomenologists ==it's smth that draws your attention and actions== (how you act is more important that what you say)", "children": [{"text": "Negative element of meaning affects your attention and actions a lot"}, {"text": "You act as if it't the most real things — pain, anxiety, terror etc."}, {"text": "Rationality is powerless against them"}, {"text": "And you can not rationalise yourself out of actions that are caused by negative meaning"}]}]}, {"text": "9. Things that manifest themselves to you as meaningful are constitute a gateway btw [structure] and [possibility]", "children": [{"text": "1. World is composed of set of possibilities, not of a fixed reality"}, {"text": "2. You need structure to orient yourself in the world of possibility"}, {"text": "3. But the problem with structure that it can blind you to possibility"}, {"text": "4. You need to balance the possibility and the structure"}]}, {"text": "10. If you follow that which \"shines forth\" then you stay sufficiently in the structure but at the same time you pulling in enough possibility so that the structure stays dinamic and alive instead of static and dead. Short feedback loop btw you and nature / reality — actually ==looking where the attention is drawn== is <mark class=\"hltr-grey\">anxiety provoking enough</mark> to [keep you awake] and it's <mark class=\"hltr-grey\">compelling enough</mark> to [keep you interested] = **==definition of meaning==**", "children": [{"text": "Negative emotions are embodied signals that smth in YOU (big you = environment you're in) is non-optimal. So they are pointers to WHAT CAN BE FIXED"}]}, {"text": "11. Flip your pre-conseptions and make a supposition that material world is actually secondary and derivative of smth that's more fundamental → possibility. ==And possibility shines through structure with meaning=="}]}, {"text": "**The phenomenological perspective + therapy ==(Carl Rogers)==** (?)", "children": [{"text": "Carl Rogers was a therapist and a christian ethicist"}, {"text": "**==Carl Rogers==** used / simultaneously developed these concepts but with focus on practice in therapy. He developed a method that allow to use phenomenologists' ideas to make people feel better", "children": [{"text": "1. **Experience is real** (key idea of phenomenologists)"}, {"text": "2. The way by which most people represent their experience is by communicating to other people"}, {"text": "3. Communication frame \"Unconditional positive regard\" was suggested by Rogers as the most efficient by definition (but it's really not simple). \"Making things better\" requires not only **==skill of active listening==** (→ other person) but drives your personal integration, because the more you listen the more you'll find true and important things that should be implemented in your world view hence replace (kill) your old values", "children": [{"text": "The first requirement for really listening to other person is courage. Not to be afraid of changing yourself"}, {"text": "Therapy is a time consuming process because advice doesn't work", "children": [{"text": "Advice often cause the opposite effect because a person tries to maintain autonomy. Active listening (based on truth) works instead. When a person describes his problems, a therapist helps him to separate the weeds from the chaff, and a person comes to the realization on their own — that's the most effective way"}]}]}, {"text": "4. Exposure is the path to strength"}, {"divider": true}, {"text": "**==Skill of active listening==** is theraputic", "children": [{"text": "1. Theraputic conversations are the ones that helping a person to become a <mark class=\"hltr-green\">better</mark> person"}, {"text": "2. 2 pre-conditions for such conversations are <mark class=\"hltr-orange\">1. Truthful information exchange</mark> and <mark class=\"hltr-green\">2. Desire to make things better</mark>", "children": [{"text": "+ acceptance that other person can help to make things better"}, {"text": "You can't help someone who hasn't decided \"I want things to be better\""}]}, {"text": "3. \"Better\" differs from person to person → a lot of discussion have to be about <mark class=\"hltr-green\">what constitutes \"better\" for this particular person</mark> → and for a lot of people that's <mark class=\"hltr-grey\">the time when they are actually thinking</mark> about the problem", "children": [{"text": "<mark class=\"hltr-grey\">___</mark> When you carefully listen to a person and tell the story back to him / her, you're not telling the exact story, you're telling the summary and by definition pruning the original story to the essence → if pruning is correct you're helping a person to think and to kill death branches of his thinking tree (\"Ah, yes, this is what I actually ment\")"}]}, {"text": "4. So the skill of active understanding and listening is a key", "children": [{"text": "Listening — trying to figure out what the other person is telling you (and <mark class=\"hltr-grey\">other person is often don't know what he or she wants to tell exactly</mark>)"}, {"text": "Listening isn't simple. Other person will put stoppers / blockers other person might put while you're trying to understand what he's trying to say", "children": [{"text": "Cliches"}, {"text": "Saying something annoying"}, {"text": "Cry / get angry", "children": [{"text": "If a person gets angry or cries that doesn't mean the conversation is over or you're a sadist"}, {"text": "That's unconscious techniques to check if the topic is important"}]}]}]}, {"text": "5. Listening with understanding means constructing clear enugh picture of what the other person want so that you can change your actions or perceptual scheme with wich you look at the world", "children": [{"text": "So you will die and reborn with every deep and understanding conversation"}, {"text": "Some of your beliefes will die and it's painful (if you identify yourself with your beliefes)", "children": [{"text": "But the better strategy is to identify yourself with the entity that are constantly transforming and generating better beliefs"}]}]}, {"divider": true}]}, {"text": "Result of a conversation can be [Genuine and productive exchange of information] vs [hardening of prejudice / increase of polarisation (2)]. **==Unconditional positive regard (Rogers) is the way to make conversation the former not the latter==**", "children": [{"text": "1. Unconditional positive regard (Rogers)", "children": [{"text": "Pre-condition: \"I want things to be better for US after the conversation then before\""}, {"text": "I regard a person I'm talking with as someone who could transform in a positive direction and who's willing to attempt that"}, {"text": "AND I COMMUNICATE TO THAT END OF THE PERSON"}, {"text": "And **it requires SKILL OF LISTENING**"}, {"text": "If requires to put yourself in other person's shoes and use emodiment — mirroring people's emotions helps drawing inferences of what they want from noticing of how you're feeling"}, {"text": "\"Understading with the person, not about him\""}, {"text": "\"Real communication occurs and the evaluative tendency (2) avoided when we listen with understanding\""}]}, {"text": "2. The requirement to conduct conversations in a such way is to have a really developed skill of listening"}, {"text": "3. Technique for how to learn to listen from Rogers", "children": [{"text": "Each person can speak up for himself only after he has first restated the ideas and the feelings of the previous speaker accurately and to that speaker satisfaction"}, {"text": "↑ straw-man argument vs making your opponent's point of view as strong as you can and then argue"}]}]}]}]}, {"text": "<mark class=\"hltr-red-light\">Fit?</mark>", "gap_before": 1}, {"text": "Jung & Rogers: if you will try follow this optimal state — it will take you to all the places you don't want to go / avoiding"}, {"arrow": true, "gap_before": 1}, {"text": "Phenomenologists say reality is best concieved as a totality of your experience (phenomenological field). **==EXISTENTIALISTS==** **add ==morality== to this idea**:", "children": [{"text": "1. Existentialists claim that сonditions of <mark class=\"hltr-red-light\">existance are so tragic that the default condition of humans is psychopathological</mark>", "children": [{"text": "синхронизировать с [[2014 Personality ✓#^kjz57j|этим]]", "children": [{"text": "People are self-conscious ↓"}, {"text": "We know we are going to die, we are prone to illness (and so is everyone else we know) and aging"}, {"text": "We can be damaged by betrayal, untruth, falsehood"}, {"text": "We know that 150 things is wrong with us and we even can't fully articulate them"}, {"text": "**We fall short of perfection along pretty much any axis of comarison that we generate**"}, {"text": "So the default condition of humans is psychopathological"}]}]}, {"text": "2. ==The degree== to which this ==phenomenological field== (by def the whole world) ==is fractured== incoherent and paradoxical is ==determining== the proportion of ==weakness in your spirit== and personality"}, {"text": "3. You're going to **==make the tragic situation of life worse==** (the life of the whole world) **==if you don't cut all the things you know to be inadequate and wrong==** in your phenomenological field of operation → it's your moral nessesity or moral duty to fix your phenomenological environment, or you'll make life more miserable to everyone else"}, {"text": "4. You can't escape it. It you don't shoulder this responsibility you'll inevitably suffer the consiquences. You can't get away with being [[d_Immoral|immoral]]", "children": [{"text": "Guilt and fear are debts to possibility", "children": [{"text": "Failure to shoulder existenial burden producing neurotic guilt and fear"}, {"text": "Kierkegaard's point is that guilt itself isn't something to be cured"}]}]}, {"text": "5. Existentialists essentially add the notion of morality to the Phenomenology"}, {"text": "Phenomenology — expanded the notion of experience, redefined it by adding the external phenomenological field"}, {"text": "Existentialist — found out that it's immoral to not to fix your phenomenological field", "children": [{"text": "\"being has implicitly moral dimension\""}]}]}, {"text": "**What could you do about it? Become strong enough to bear the conditions of life.**", "gap_before": 1}, {"text": "1. Stop doing false and inauthentic things", "children": [{"text": "1. See what happens if you ==stop doing things you know to be inadequate, wrong and FALSE==: every time you're doing it — you are weakening yourself AND failing to expand your domain of competence", "children": [{"text": "1. There's a set of things you **know** you shouldn't do"}, {"text": "2. There a subset of things you know you shouldn't do **and you can stop doing**."}, {"text": "3. ==Stop doing those=="}, {"text": "4. When you do, your vision will clear a bit and you'll **find out new** things you know you shouldn't do and can stop doing"}]}, {"text": "2. If you proceed doing wrong things you know you can stop doing, life will go from bad to worse and not only for you but for everyone around you (because your actions affects all your existential space)", "children": [{"text": "The most effective way to aiding the world is to ==clean up your existential space=="}, {"text": "But if you fail to do it you can make things worse for everyone around you"}]}, {"text": "3. If you stop doing it, then you eventually become strong enough to bear the conditions of life", "children": [{"text": "~~NORM getting a traumas~~"}, {"text": "NORM being resilient so you don't get any trauma"}]}]}, {"text": "2. USE ==TRUTH==", "children": [{"text": "==Truth is the foundation== (one of key claims of existentialists)"}, {"text": "1. Existentialists are very concerned with authentisity", "children": [{"text": "It's not obvious weather you can formulate what is true. But determine what is false is easier"}, {"text": "==Incongruent / Inauthenic== — when your high level abstractions (that you associate with yourself) don't match with what you're actually doing (level of acions) — when you're not a singular entity on all the multiple levels at which you exist", "children": [{"text": "E.g. acting out ideology when it has nothing to do with reality individuals are experincing"}]}, {"text": "You can tell when you're saying smth that's not authentic by feelling out weather it makes you weak or strong"}, {"text": "Rule: if you are saying smth and it makes you weak — SHUT UP / stop talking and try to find another words that don't produce that sensation"}]}, {"text": "2. ==Existentialists are very concerned with authentisity because thery are very concerned with truth=="}, {"text": "3. Thery are very concerned with truth because truth is implicit for creating proper model of behaviour and perseption to bear the conditions of life", "children": [{"text": "Def of truth in existentialism is different from [[Scientific method|scientific truth]] (constant outcome across observers + claim of a passive observer)"}, {"text": "For them it's a way of being, not a collection of descriptions. Truth is discovered in actions (claim of a someone who's actively interacting with the world) → there're ways that are improper (technically)", "children": [{"text": "You want A"}, {"text": "If you act in a bunch of ways that makes it absilutely impossible to achieve A, it's self-contradictory"}, {"text": "So you need do things that will get you to A"}, {"text": "And that's things based on truth and morality by definition"}, {"text": "SO"}, {"text": "As soon as you ACT you are immideately making a claim about the structure of the world and about appropriate actions. You can't get out of that"}]}, {"text": "→ a truth you can not live is not truth"}, {"divider": true}, {"text": "Nihilistic pov is easier", "children": [{"text": "Nothing will matter in a 100y, everything's relative that's why no matter what you do, you can get away with it"}]}, {"text": "The opposite pov is much scarier and much harder", "children": [{"text": "==Everything matters, everything is linked to everithing, and you can't get away with anything== (religion → concept of responsibility and suffering for all humanity)"}]}, {"divider": true}, {"text": "You also make choices with an incomplete information. You bet your life on your beliefs / your words (faith). Are you going to bet on truth or falsehood?"}]}, {"divider": true}, {"text": "Lie make people sick — one of big claims of existentialists", "children": [{"text": "Freud attributed a lot of pathology to repression. But the difference btw repression and self-deceit is very vague"}, {"text": "What's the difference btw repressing smth and liying to yourself about it?"}, {"text": "You did / smth happend to you that you don't like. You COULD think it through, but you didn't. And you did it again and again until it's a habi
