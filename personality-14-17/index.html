t of lying to yourself about that thing"}]}]}, {"text": "3. AND FOLLOW ==MEANING==", "children": [{"text": "Possibility shines through structure with meaning and ==if you refuse to explore== what \"shine forth\" / has drawn you attention ==you will suffer the consequences==", "children": [{"text": "It will make you progressively weaker. You'll have a lot of chaos and not enough order (yourself) in you, and if will either lead you to not believing that order is real (nihilism) or totalitarian ideological ideas will fill in the gaps that are not filled with \"you\"", "children": [{"text": "Idologies stagnate and become brittle becase there's no transformation in them because all of the people inside of them decide that transformation is unnessesary → ideologies become increasingly outdated and corrupt"}]}]}]}, {"divider": true, "gap_before": 2}, {"text": "The existentialists of the late 19th century attempted to diagnose the human personality at a deeper level than anyone else had ever attempted. And their conclusion was that", "gap_before": 1, "children": [{"text": "Existentialism proposes a theory that connects the individual actions to the pathologies of the whole societies", "children": [{"text": "The appropriate level to study mass catastrophies of society is level of individual personality"}, {"text": "==Societies become pathological in precise proportion to the degree of the individuals that makes up this society become decietful and irresponcible==", "children": [{"text": "Example: 30mln people were killed during Soviet's repressions", "children": [{"text": "Solzhenitsyn concluded USSR repressions were the consequences of inauthenic thought and speech of individual people"}]}, {"text": "This is what happens when pre-suppositions that Phenomenologists and Existentialists held about reality are completely dismissed in favour of rationalist utopianism"}, {"text": "20th centure clearly shows that rationalist utopianism (that leads to totalitarism) **consistantly** causes a lot of death and misery"}, {"text": "We may not be so sure what's right, but this one is wrong"}, {"divider": true}, {"text": "USSR managed to maintain itself for so long because individuals were willing to give up their responsibility of their own relationship to the truth to the state and constantly lied to themselves"}]}]}]}, {"text": "The destruction by rationality of the evolved systems of meaning that people had previously lived within had undermined the phsychological strength of each individual divorced from their own history. That let them gravitate towards either nihilism or totalitarinism"}, {"text": "In the background the existentialists were putting forward a theory which was that if people lived up to their own possibility and held on to their own experience as if it were true and did not substitute for that idiological beliefs that it would be possible for each person to find a wellspring of meaning that would be a sufficient replacement for what had been lost historically without having to fall into the nihilism or totalitarinism. Society is macrocosm of the individual. Not the other way around. Single individual properly developed can stand up against a tyranny and win ← this is the lesson of the 20th century"}, {"divider": true, "gap_before": 6}]}]}, {"text": "3. Biology of brain and body / Neuroscience / Behavioural science / Learning theory / Traits (biological prerequisites of w_to_do = being_becoming model model)", "heading": true, "level": 3, "children": [{"text": "a.  This part integrates [symbolic systems and psychology] with [their biological prerequisites]", "heading": true, "level": 5, "gap_before": 1, "children": [{"text": "In other words: how [what we made of] **defines** these insights above of [what we should do]"}, {"text": "Basic nervous system functional organisation"}]}, {"text": "3.1  Nervous system functional organisation (neuroscience + behavioural science)", "heading": true, "level": 5, "gap_before": 1, "children": [{"text": "1. A lot of your `being & becoming` is regulated by the deep biological systems"}, {"text": "2. On the lowest biological level the framework \"<mark class=\"hltr-green\">1. where you are</mark>, <mark class=\"hltr-green\">2. where you need to go</mark>, <mark class=\"hltr-green\">3. what you should do</mark>\" is filled up with **==basic biological nessesities==** — they are the most vital / critical components of these three sets because they are responsible for **==staying alive==**", "children": [{"text": "Basic biological nessesities have been there for so long that humans evolved **==automated machinery== to deal with them** — [[00 Primal basic motivations circuits|primal circuits]]"}]}, {"text": "3. Having a set of basic biological nessesities are the form of solving the main problem (function) our brain has — **reducing the complexity of reality**. This is the main function of a nervous system [[Simplified evolution of the brain — the intermediary btw sensory and motor cells|by definition]]. Brain reduce this complexity by [[Brain’s key obj is FILTERING or COMPRESSING complexity to only what MATTERS TO THE GOAL|filtering reality down]] to [the one most important process → the one concrete action] right here right now that the organism need <mark class=\"hltr-green\">to do</mark> to <mark class=\"hltr-green\">reach</mark> the <mark class=\"hltr-green\">desired outcome</mark>", "children": [{"text": "Pros and cons of filtering / framing", "children": [{"text": "You see the situation IN ONE WAY"}, {"text": "but you can ACTUALLY DO something"}]}, {"text": "A lot of framing in the civilised world isn't done psychologically — it's done by various systems: from your body to the culture as a whole", "children": [{"text": "Culture / state / civilised world took care of an awful lot of dangerous things (cities, safety etc. Culture keeps the lights on and actually protects you from death)"}, {"text": "A fair bit of filtering is also going on on a physical level: you can only see skin, can't see back of other person, can't see his family and relations etc. You can't see at a very small scale / very big scale. You can just see through your eyes, you are blind to a lot of complexity of the world and of other persons"}]}, {"text": "But really — complextity isn't ever really dealt with", "children": [{"text": "Humans are the organisms that accrued the knowledge of how to deal with complexity with avarage timespan of about 80 years (100 years if you're lucky). If it wouldn't be the case — you wouldn't die", "children": [{"text": "Solution for a problem in terms of evolution — the organism lived long enough to duplicate"}, {"text": "Obvious way to deal with problems — create variants of organisms with such variety that can outrun the changing environment a little bit (a little bit greater then 1 offspring)"}]}]}, {"divider": true}, {"text": "Examples", "children": [{"text": "Example of complexity of reality", "children": [{"text": "Sub-atomic, atomic, mollecular, oragns / brains, connections of multiple brains in small groups `— families`, large groups `— tribes`, very large groups `— societies`..."}]}, {"text": "Biological example of the filtering (biology of the eyes)", "children": [{"text": "[[00 Fovea|Fovea]]"}, {"text": "Еffect of the goal on the eye perception in the gorilla experiment"}]}, {"text": "Linguistic example of the filtering", "children": [{"text": "[[Screenshot 2024-02-08 at 21.16.36.png|Real world (thing in itself) → (partial) representations → words]]", "children": [{"text": "Origin of language", "children": [{"text": "Language has originated from pre-linguistic prototipic forms of communication like some vocals that means \"there's a leopard\" or \"there's an eagle\" etc. (same brain regions that were responsible for that are responsible for curses → Turret syndrome is when you pre-linguistic circuits are disinhibited) (curses are important ☝️)"}, {"text": "[[Why do you curse when your computer crashes?|→]]"}]}, {"text": "the more vocabulary you have — the higher your ability to compress"}]}]}]}, {"divider": true}, {"text": "Consciousness is likely evolved as a way to do relevance realisation", "children": [{"text": "Multi-level", "children": [{"text": "Computer or car is multilevel from quantum mechanics to political system"}, {"text": "So are you"}, {"text": "If there's a problem somewhere down or up the level of analysis of you — **it is automatically in YOU**"}]}]}]}, {"text": "4. \"Most important process right now\" is called a ==**motivated state**== (higher order motivated state is a goal). Motivated state (that is chased right now) determines what will be filtered out. <mark class=\"hltr-red-light\">Motivations defines conceptual space within which you percieve the world</mark> and within which you act towards some end-point <br>`{Psychologically: motivations set goals}`", "children": [{"text": "1. **End-point** is specified by motivational system (often hypothalamic system)"}, {"text": "2. **Filtering (perception)** is specified by motivational system"}, {"text": "3. **Motor schemes and autonimic responces** (e.g. activity in digestion system) that is often used to movement towards this goal is also specified by motivational system (by inhibiting or disinhibiting)"}, {"divider": true}, {"text": "MOTIVATED STATES are a biological pre-requisite to SUB-PERSONALITIES from Theories of philosophy and psychology"}, {"text": "[[00 Primal basic motivations circuits|Primal basic motivations]]"}]}, {"text": "5. **==Emotions==** <mark class=\"hltr-red-light\">track progress towards the satiation</mark> of the motivated state <br>`{Psychologically: emotions regulate orientation towards these goals}`", "children": [{"text": "[[00 Basic emotions|Primal basic emotions]]"}]}, {"text": "6. Here's a description of a basic storyline of how ==of how exactly nervous system do this job== based on [[Nervous system functional organization|nervous system functional organization]] (which maps perfectly on Pieget)", "children": [{"text": "1. You wonder through the world (with the main goal is to stay alive and satiate the basic nessesities) and your [[00 Limbic system (reptile brain)#^nf3w02|hypocampus]] looks [inside] your memory systems to see what it is that you want to have happen based on your understading of the world (your expectations of how a motivated state might end)", "children": [{"text": "The whole sensory-motor-perception-action hierarchy has to be constructed so that your basic motivational states stay satiated / fulfilled. But not only satiated but satiated within the social context (all people around with the same needs) — <mark class=\"hltr-red-light\">this is transition to Pieaget</mark>"}]}, {"text": "2. [[00 Limbic system (reptile brain)#^nf3w02|Hypocampus]] is also [looking at the world] and checking whether this pictures are the same (meaning you know what you're doing and you know where you are)"}, {"text": "3. IF IT'S <mark class=\"hltr-green\">MATCHED</mark>, [[00 Limbic system (reptile brain)#^nf3w02|hypocampus]] inhibits (↓) the [[00 Limbic system (reptile brain)#^c00ynl|amigdala]] and [[00 Limbic system (reptile brain)#^9mc3e0|hypothalamus]]"}, {"text": "4. IF IT'S <mark class=\"hltr-red-light\">NOT MATCHED</mark>: [[00 Limbic system (reptile brain)#^nf3w02|hypocampus]] disinhibits (↑) the [[00 Limbic system (reptile brain)#^c00ynl|amigdala]] (negative emotion responce) and [[00 Limbic system (reptile brain)#^9mc3e0|hypothalamus]]", "children": [{"text": "Level of this disinhibition is obviously dependent on a situation BUT also on your charachter", "children": [{"text": "How woried should you be? On a \"good person level\" (maybe you're not looking at the world right) or at \"this hour level\"? You don't know where the error is located"}, {"text": "THAT'S WHY you have temperament distripution"}]}]}, {"text": "5. The goal of this disinhibition it to deal with mismatch and to learn as a result", "children": [{"text": "1. Hypothalamus sets up your frames of motivation"}, {"text": "2. And then runs one of those to its positive conclusinon"}, {"text": "3. Anything that indicates that it might happen — that's incentive reward (you can learn that but some of that is also innate)", "children": [{"text": "Examples of innate", "children": [{"text": "Snake"}, {"text": "Fire"}, {"text": "Teeth"}, {"text": "Starring eyes"}, {"text": "Predatory postures"}, {"text": "Loud low frequency vocalizations"}]}]}, {"text": "4. On top of hypothalamus there's circuits which ensures <mark class=\"hltr-orange\">LEARNING</mark> (these are memories and emotions)", "children": [{"text": "Learning is the process that ensures that probability of getting into the state of not-satiated basic need DECREASES and the probability of satiating not-satiated basic need FASTER INCREASES"}, {"text": "The goal of emotion system and a memory system is to change these probabilities (learning)", "children": [{"text": "Emotion system is the system of tracking and regulating the orientation towards the satiation of a motivational states AND the system that enables learning (dealing with new things)", "children": [{"text": "**Novel things** are the things that are paradoxical meaning you don't understand wheather they are good or bad. When you face novel things [[Pasted image 20230311162236.png|you react with emotions]]", "children": [{"text": "This class of **novel things** things are the main concern of phenomenologists → you encountering smth that you haven't already understood"}, {"text": "The probabilities (highly depending on a biological circuits) of negative and positive reactions (units of emotions to units of potential promise / threat) = Neurodisism and Extraversion"}]}]}, {"divider": true}, {"text": "Unconditioned rewards (consummatory reward):", "children": [{"text": "﻿﻿Fulfills basic motivational state"}, {"text": "﻿﻿Satiation: Brings motivation on that dimension to a halt"}, {"text": "﻿Associated with serotonin"}, {"divider": true}, {"text": "\"Consumatory reward\"-class of positive emotions is about tracking of how these input **states** ([[Nervous system functional organization|here]]) are satiated"}]}, {"text": "Conditioned rewards (incentive reward):", "children": [{"text": "﻿﻿Indicates progress towards consummatory reward"}, {"text": "﻿﻿Can be learned (conditioned) - but also innate"}, {"text": "﻿﻿Associated with dopaminergic activation (exploration circuit that comes out of hypothalamus)", "children": [{"text": "Exploration, extraversion, happines"}, {"text": "Enthusiasm, assertiveness"}, {"text": "Positive element of Novelty"}]}]}, {"text": "Unconditioned punishments:", "children": [{"text": "﻿﻿Punishes motivational state or subset of stale"}, {"text": "﻿﻿Pain, frustration, disappointment, grief"}]}, {"text": "﻿﻿Conditioned punishments", "children": [{"text": "﻿﻿Threats (produces fear)"}, {"text": "﻿﻿Can be learned (conditioning) - but also innate.", "children": [{"text": "Predation and dominance signals"}]}, {"text": "Dampened by serotonin and GABA (anxiolitic -- makes you less anxious)", "children": [{"text": "Neuroticism: withdrawal, volatility"}]}, {"text": "Negative aspect of novelty (anxiety)"}]}]}]}]}, {"divider": true}, {"text": "Cortical area enables us to chain ever more complex patterns of behaviour together AND develop patterns of behaviour that exceed instinctual specification"}, {"text": "Cortex is the evolved instrument to mediate sub-cortical conflicts", "children": [{"text": "A lot of presuppositions are intrinsically in conflict — cortex is the evolved instrument to mediate sub-cortical conflicts"}, {"text": "When you do things (can you build a bridge?) — there's a lot of presuppositions", "children": [{"text": "From technical and cultural", "children": [{"text": "I can't build a bridge that lasts for 1000000 years"}, {"text": "I can't build a bridge without resources and alone"}, {"text": "I will build a bridge that's sutable for people and cars and will not collapse under their weight"}, {"text": "We will use the same language to communicate and use our culture's traditions to organise the process"}]}, {"text": "To the most basic darwinian", "children": [{"text": "We assume that during the process our basic motivations (hunger, thirst etc.) will be saciated"}]}]}]}]}, {"text": "7. Nervous system functional organization (motor scheme, autonomic responces, filtering) has high-order conceptions (like \"am good person\") as an input", "children": [{"text": "This hierarchical structure is the reason why humans can undermine themseves with thoughts (and hence cause depression and mental illnesses)"}]}, {"arrow": true}, {"arrow": true}, {"text": "Техническое описание: ключевой функции мозга, связки \"мы автоматически видим meaning/usefullness\", нейромедиаторов (Carl Friston)", "children": [{"text": "Categories are the mechanism of binding entropy", "children": [{"text": "entropy", "children": [{"text": "= surprise = violation of predictions", "children": [{"text": "= free energy"}]}]}, {"text": "binding entropy", "children": [{"text": "= minimising surprise = minimising prediction error", "children": [{"text": "= binding free energy"}]}]}]}, {"divider": true}, {"text": "Hyppohampus is the brain part that contrasting [the expectation of the reality (based on internal model)] to [the sensory data (actual reality)]"}, {"text": "But more precisely", "children": [{"text": "~~expectation~~ → desire <br>Models of cold cognitive computation → models of motivation", "children": [{"text": "You are not doing mathematical predictive processing. Youre brain is more like making fatasies (inferences) about the future", "children": [{"text": "Vanilla predictive processing only deals with sence prediction (in the moment)"}, {"text": "Desisions, choises, actions — making inferences about the future"}]}]}, {"text": "~~sensory data~~ → model of the reality <br>Reality itself → the model by which you percept reality"}]}, {"text": "contrasting [desire caused by motivated state] and [model by which you percept reality]"}, {"divider": true}, {"text": "Brain main goal is <br>**Minimising expected surprise / resolve uncertainty**", "children": [{"text": "Expected surprise mathematically = entropy / uncertainty"}, {"text": "\"I choose (when I haven't actually seen the future yet) the things that I do to minimise expected surprise in the future\""}]}, {"text": "There are two ways", "children": [{"text": "1. Choosing those behaviours that resolve uncertainty of current situation (to look at the bushes to see weather it was a bird or a tiger) (information gain)"}, {"text": "2. Avoiding putting myself into surprising situations"}]}, {"divider": true}, {"text": "1. How do you decide weather two goblets (кубки) are the same? (in reality they are actually physically different in a near infinite number of ways)"}, {"text": "2. If you can drink from both of them using the same sets of action patterns"}, {"text": "3. In other words — if they are substitutable within the higher order conseption structure (like drinking wine)", "children": [{"text": "In other words — if I can get those invariences out (and the outcome is reasonably unchanged) then they are the right kinds of affordances of my model of how I'm gonna behave in the situation"}]}, {"text": "4. We see PATTERNS IN THE WORLD THAT HAVE FUNCTIONAL UTILITY", "children": [{"text": "*Theory of identity or resemblance* <br>Finding latent categories / structures / resemblance that are conserved of different contexts that enables you to have a simple but apt for purpose model of the world", "children": [{"text": "Эксперимент, где людей просили помочь найти дорогу, в процессе разговора между ними проходили носильщики стекол и swap-ался человек, который спрашивает, и люди этого не замечали"}]}, {"arrow": true}, {"text": "Optimal simple explanation is the least complex affordance nessesary for the operation at hand", "children": [{"text": "affordance — такое свойство предмета или объекта окружающей среды, которое позволяет использовать его определенным образом"}, {"divider": true}, {"text": "based on Andrew Gibson's model"}]}, {"text": "Kinds of affordances", "children": [{"text": "Tools", "children": [{"text": "Those things that you can get a grip on the world with and move forward towards a desired goal"}, {"text": "Microstory about the tool (how it can help you to reach the goal)"}]}, {"text": "Obstacles", "children": [{"text": "Things that get in your way"}, {"text": "Microstory about the obstacle (how it stop you from reaching the goal)"}]}, {"text": "Pathways", "children": [{"text": "Smth that is littered with tools and obstacles"}, {"text": "Description of a pathway with some pattern and the actor (subject) is a story"}]}]}, {"divider": true}, {"text": "CONNECTION: We see meaning and infer the object ! → ! we see PATTERNS IN THE WORLD THAT HAVE FUNCTIONAL UTILITY"}]}, {"divider": true}, {"divider": true}, {"text": "5. Microstories about tools and obstacles are micro-**plans** into the future"}, {"text": "6. Your model of the world is represented by some number of micro-narratives"}, {"text": "7. We are constantly trying to find the one with the ones that leads to information gain / or avoding surprises (возврат в первую классификацию в начале этой логической цепочки)", "children": [{"text": "= constantly trying to unify these micro-narratives into larger narrative (to optimise the binding of entropy / minimising surprises)", "children": [{"text": "Like the gist of number of universal micro-narratives for reciprically communicating with people with increasing utility — are genuine altruistic reciprosity"}]}]}, {"divider": true}, {"text": "We are looking for novelty that can resolve the uncertainty (Friston)"}, {"divider": true}, {"text": "On micro-level we resolve uncertainty in communication with other people by asking questions (to put them e.g. into particular category, bind them to my internal narratives), but on the macro-long-term-level you are trying to make other people like you and they are trying to make you like them (the closer we are in terms of everithing language, narrative, social patterns — the more predictible we are as a system) → this results in generalised synchrony (basically aligning ourselves) / also in the form of generalised narrative, BUT also keeping [find novel things] part as a best way to minimise surprise", "children": [{"text": "1. You making other people like you and they making you like them → \"information gain\""}, {"text": "2. Finding out what smbdy not like me is like → \"Avoiding putting myself into surprising situations\""}]}, {"divider": true}, {"text": "\"You making other people like you and they making you like them\" in the conceptaul frame IS A GAME (activity with shared narrative)", "children": [{"text": "Enabler of this interpersonal game with the common narrative (from the \"good conversation\" to \"commiting to the eternal wisdom that is God\") is commiting to hypothesis that you're very much like me → so what I would feel if I sensed what you sensed is going to be a very good proxy for your feelings"}]}, {"divider": true}, {"text": "==Dophamine== is a chemical that enables backpropagation (in ML terms) to update the weights of the model more to the patterns of success and away from the patterns of failure. Technically it's making connections btw some groups of neurons more stable and fast.", "children": [{"text": "When you take cocaine — it's messing with your dophaminergic system to strengthen the paths that are connected with taking cocaine"}]}, {"text": "==Serotonine== is a chemical that regulates propagation of error from the bottom upwards", "children": [{"text": "Like if your serotonergic system is messed up in context of depression you propagate errors way more intensly up the hierarchy then nessesary", "children": [{"text": "We had a fight with my wife → ~~I'm more irritable because I haven't eaten in the evening~~ I'm a bad person / The marrige is over"}]}, {"text": "Animals that have higher social status (therefore occupy more secure position in the social and environmental hierarchy) are more resistant to anomalies", "children": [{"text": "Connect to \"your brain computes the likelyhood of you being at the top of a hierarchy and modulating (with serotonine) how to propagate error up your internal model of conceptions\""}]}]}, {"divider": true}, {"text": "Message passing in hierarchy (which is literally our brain)"}, {"text": "Each level of the hierarchy recieves information from below and tries to explain away the information based upon top-down predictions and that which can not be explained is ensuing prediction error"}, {"text": "These prediction errors are used to revise sub-personal beliefs of representations at the higher level until top-down predictions are more apt to explain away what's going on below"}, {"text": "Weight of prediction errors that you are passing to hierarchy above (==precision== — sensitivity or resistance to the ascending prediction errors) is conrolled by [[00 Neuromodulators|neuromodulators]] namely serotonine and acetylcholine", "children": [{"text": "\"conrolled by [[00 Neuromodulators|neuromodulators]]\"", "children": [{"text": "More precisely — the excitability of the neuronal cells that are broadcasting the prediction errors to the next level"}]}, {"divider": true}, {"text": "In other words — serotonine and acetylcholine regulate the capacity to ignore the stuff that's irrelevant", "children": [{"text": "serotonine at a higher levels of the neural hierarchy — regulates more abstract beliefs"}, {"text": "acetylcholine at a lower levels of the neural hierarchy"}]}]}]}]}, {"text": "3.2  Traits — as stable clusters of biological differences (predisposition to different motivations & emotions → different perception)", "heading": true, "level": 5, "gap_before": 1, "children": [{"text": "1. Biological differences defines the proclivity of each human to // ── Инлайн-разметка Obsidian → HTML (как в PDF: ==hl==, **bold**, стрелки остаются) ──
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function markup(t){
  t = esc(t);
  // Highlightr Obsidian (<mark class="hltr-...">) → подсветка С СОХРАНЕНИЕМ цвета-класса.
  // esc не трогает кавычки, поэтому class="..." доезжает целым.
  t = t.replace(/&lt;mark class="(hltr-[\w-]+)"&gt;/g, '<mark class="$1">')
       .replace(/&lt;mark\b[^&]*&gt;/g, '<mark>')
       .replace(/&lt;\/mark&gt;/g, '</mark>');
  // переносы строки Obsidian (<br>) → реальный перенос, а не литеральный текст
  t = t.replace(/&lt;br\s*\/?&gt;/g, '<br>');
  // вики-ссылки [[target|alias]] / [[target]] → читаемый текст (цель в деплое недоступна → не кликабельно).
  // alias '_' (заглушка Никиты) игнорируем; из target срезаем #^block, ведущий «00 », префикс d_.
  t = t.replace(/\[\[([^\]]+?)\]\]/g, function(m, inner){
    var parts = inner.split('|');
    var alias = parts.length > 1 ? parts[parts.length-1].trim() : '';
    var label = (alias && alias !== '_') ? alias
              : parts[0].replace(/#\^?[\w-]+$/,'').replace(/^\d+\s+/,'').replace(/^d_/,'').trim();
    return '<span class="wl">'+label+'</span>';
  });
  // одиночные [текст] (категории/понятия автора) → сиреневый, как accent Obsidian (стандартное поведение волта)
  t = t.replace(/\[([^\[\]]+)\]/g, '<span class="br">[$1]</span>');
  t = t.replace(/==(.+?)==/g, '<mark>$1</mark>');
  t = t.replace(/~~(.+?)~~/g, '<s>$1</s>');
  t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/`(.+?)`/g, '<code>$1</code>');
  return t;
}
// Маркер списка как в оригинале: ведущее 'N.' → номер, иначе буллет •
function splitMarker(text){
  const m = text.match(/^(\d+)\.\s+([\s\S]*)$/);
  if(m) return [m[1]+'.', m[2]];
  return ['•', text];
}
function crumbLabel(node){
  let t = node.text
    .replace(/\[\[(?:[^\]|]*\|)?([^\]|]+)\]\]/g, '$1')   // [[t|alias]]→alias, [[t]]→t
    .replace(/[=*`~]/g,'').replace(/^\d+\.\s+/,'');
  return t.length > 22 ? t.slice(0,22).trim()+'…' : t;
}

// ── Навигация по дереву через path (массив индексов) ──
function nodeAt(path){ let n = TREE; for(const i of path) n = n.children[i]; return n; }
const key = path => path.join('.');

const state = {
  root: [],                 // путь до текущего корня zoom ([] = весь конспект)
  collapsed: new Set(),     // ключи свёрнутых узлов
};

// ── Персист состояния (свёрнутые узлы + позиция zoom) между открытиями ──
const LS_KEY = 'conspect_personality-14-17_state';
function saveState(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({
    root: state.root, collapsed: [...state.collapsed]
  })); }catch(_){}
}
function loadState(){
  try{ const s = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if(s){ if(Array.isArray(s.root)) state.root = s.root;
           if(Array.isArray(s.collapsed)) state.collapsed = new Set(s.collapsed); }
  }catch(_){}
}

// обойти все узлы-с-детьми под заданным path (для «свернуть всё»)
function eachNodePath(node, path, cb){
  if(!node.children) return;
  node.children.forEach((ch, i) => {
    const p = path.concat(i);
    if(Array.isArray(ch.children) && ch.children.length){ cb(p); eachNodePath(ch, p, cb); }
  });
}
function collapseAll(){
  eachNodePath(nodeAt(state.root), state.root, p => state.collapsed.add(key(p)));
  render();
}
function expandAll(){ state.collapsed.clear(); render(); }

function isTextNode(n){ return typeof n.text === 'string'; }

// класс воздуха из пустых строк документа (gap_before)
function gapClass(ch){
  const g = ch.gap_before || 0;
  return g > 0 ? ' gap' + Math.min(g, 3) : '';
}

// рекурсивный рендер поддерева
function renderChildren(node, path){
  if(!node.children) return '';
  let out = '';
  node.children.forEach((ch, i) => {
    const p = path.concat(i);
    const g = gapClass(ch);
    if(ch.divider){ out += '<div class="divider'+g+'"></div>'; return; }
    if(ch.arrow){ out += '<div class="arrow'+g+'">↓↓↓</div>'; return; }
    if(ch.img){
      out += '<figure class="imgrow'+g+'"><img src="'+ch.img+'" data-full="'+ch.img+'" alt="img">'
           + '<figcaption>'+esc(ch.caption||'')+'</figcaption></figure>';
      return;
    }
    const hasKids = Array.isArray(ch.children) && ch.children.length > 0;
    const collapsed = state.collapsed.has(key(p));
    const [mk, body] = splitMarker(ch.text);
    const k = key(p);
    // ЛЕВЫЕ маркеры (caret + bullet) → zoom-in на весь экран (Workflowy)
    const caret = hasKids
      ? '<span class="caret" data-zoom="'+k+'">'+(collapsed?'▸':'▾')+'</span>'
      : '<span class="caret empty">▾</span>';
    const bullet = '<span class="bullet'+(hasKids?' zoomable':'')+'"'
                 + (hasKids?' data-zoom="'+k+'"':'')+'>'+mk+'</span>';
    // ТЕКСТ строки → свернуть/развернуть на месте
    const cls = 'row' + (hasKids?' node':' leaf') + (collapsed?' collapsed':'') + g;
    const txtAttr = hasKids ? ' data-toggle="'+k+'"' : '';
    const hcls = ch.heading ? ' h'+(ch.level||3) : '';   // визуальный акцент заголовка по уровню
    out += '<div class="'+cls+'">'
         +   caret + bullet + '<span class="txt'+hcls+'"'+txtAttr+'>'+markup(body)+'</span>'
         + '</div>';
    if(hasKids && !collapsed){
      out += '<div class="children">'+renderChildren(ch, p)+'</div>';
    }
  });
  return out;
}

function renderCrumbs(){
  if(state.root.length === 0) return '';
  let parts = ['<span class="home" data-crumb="">конспект</span>'];
  let acc = [];
  for(let d=0; d<state.root.length; d++){
    acc = acc.concat(state.root[d]);
    const n = nodeAt(acc);
    parts.push('<span class="c" data-crumb="'+key(acc)+'">'+esc(crumbLabel(n))+'</span>');
  }
  // последний — текущий, не кликаем отдельно (он же заголовок)
  return '<div class="crumbs">'+parts.join('<span class="sep">›</span>')+'</div>';
}

function render(){
  const root = nodeAt(state.root);
  const [, body] = state.root.length ? splitMarker(root.text) : ['', root.text];
  let html = renderCrumbs();
  html += '<div class="root-title">'+markup(body)+'</div>';
  html += renderChildren(root, state.root);
  document.getElementById('app').innerHTML = html;
  // hash для «приватного якоря» на узел
  const h = state.root.length ? '#node='+key(state.root) : '#';
  if(location.hash !== h) history.replaceState(null,'',h);
  saveState();
}

// ── Делегирование кликов ──
document.getElementById('app').addEventListener('click', e => {
  // порядок важен: специфичные цели → zoom(bullet) → toggle(вся строка).
  // bullet лежит внутри row[data-toggle], поэтому zoom проверяем РАНЬШЕ toggle.
  const cr = e.target.closest('[data-crumb]');
  if(cr){ const v = cr.dataset.crumb; state.root = v ? v.split('.').map(Number) : []; render(); return; }
  const img = e.target.closest('.imgrow img');
  if(img){ const lb = document.getElementById('lb'); lb.querySelector('img').src = img.dataset.full; lb.classList.add('on'); return; }
  const zm = e.target.closest('[data-zoom]');
  if(zm){ state.root = zm.dataset.zoom ? zm.dataset.zoom.split('.').map(Number) : []; render(); return; }
  const tog = e.target.closest('[data-toggle]');
  if(tog){ const k = tog.dataset.toggle;
    state.collapsed.has(k) ? state.collapsed.delete(k) : state.collapsed.add(k); render(); return; }
});
document.getElementById('lb').addEventListener('click', () => document.getElementById('lb').classList.remove('on'));

// кнопки тулбара
document.getElementById('toolbar').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if(!b) return;
  if(b.dataset.act === 'collapseAll') collapseAll();
  else if(b.dataset.act === 'expandAll') expandAll();
});

// восстановление из hash (открытие «нырнувшим» в узел)
function fromHash(){
  const m = location.hash.match(/node=([\d.]+)/);
  if(m){ try{ const p = m[1].split('.').map(Number); nodeAt(p); state.root = p; }catch(_){} }
}

// ── Telegram WebApp init ──
try{ if(window.Telegram && Telegram.WebApp){ Telegram.WebApp.ready(); Telegram.WebApp.expand(); } }catch(_){}

loadState();   // восстановить свёрнутые узлы + позицию zoom
fromHash();    // явный якорь #node= перебивает сохранённую позицию
render();
</script>
