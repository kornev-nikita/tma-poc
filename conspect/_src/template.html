<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>personality 15 — conspect outliner</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  /* Тема Telegram с фолбэками для открытия вне TG */
  --bg: var(--tg-theme-bg-color, #ffffff);
  --text: var(--tg-theme-text-color, #1e293b);
  --hint: var(--tg-theme-hint-color, #94a3b8);
  --link: var(--tg-theme-link-color, #2f6feb);
  --sec-bg: var(--tg-theme-secondary-bg-color, #f1f3f6);
  --mark: #fff3b0;
  --indent: 17px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:var(--bg);color:var(--text);}
body{
  font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
  padding:14px 14px 80px; max-width:680px; margin:0 auto;
  -webkit-tap-highlight-color:transparent;
}

/* ── Хлебные крошки (путь до текущего корня zoom) ── */
.crumbs{ font-size:13px; color:var(--hint); margin-bottom:12px; line-height:1.5; }
.crumbs span.c{ color:var(--link); cursor:pointer; }
.crumbs .sep{ margin:0 5px; color:var(--hint); opacity:.6; }
.crumbs .home{ cursor:pointer; }

/* ── Заголовок текущего корня ── */
.root-title{ font-size:20px; font-weight:700; line-height:1.3; margin:2px 0 16px; }
.root-title mark{ background:var(--mark); color:#1e293b; padding:0 2px; border-radius:2px; }
.root-title strong{ font-weight:800; }

/* ── Строка узла ── */
.row{ display:flex; align-items:flex-start; gap:7px; padding:4px 0; }
.caret{
  flex-shrink:0; width:16px; text-align:center; color:var(--hint);
  font-size:11px; line-height:1.7; cursor:pointer; user-select:none; transition:transform .12s;
}
.caret.empty{ visibility:hidden; }
.bullet{
  flex-shrink:0; min-width:18px; text-align:left; color:var(--hint);
  font-weight:700; line-height:1.55; cursor:pointer; user-select:none;
}
.bullet.zoomable{ color:var(--link); }
.txt{ flex:1; min-width:0; }
.txt mark{ background:var(--mark); color:#1e293b; padding:0 2px; border-radius:2px; }
.txt strong{ font-weight:700; }
.row.collapsed > .txt::after{
  content:'…'; color:var(--hint); margin-left:6px; font-weight:700;
}

/* стрелка-коннектор → разделитель --- --- ↓↓↓ --- --- */
.arrow{ display:flex; align-items:center; gap:8px; color:var(--hint); font-size:12px; letter-spacing:.15em; padding:2px 0; }
.arrow::before, .arrow::after{ content:''; flex:1; height:1px; background:var(--sec-bg); }
.divider{ height:1px; background:var(--sec-bg); margin:5px 0; }
.txt code, .root-title code{ font-family:ui-monospace,Menlo,monospace; font-size:.92em; background:var(--sec-bg); padding:0 3px; border-radius:3px; }

/* картинка-узел (выровнена под текст: caret+bullet+gaps) */
.imgrow{ padding:6px 0 6px 48px; }
.imgrow img{ display:block; width:100%; max-width:300px; height:auto; border-radius:10px;
  border:1px solid var(--sec-bg); cursor:zoom-in; }
.imgrow figcaption{ font-size:12.5px; color:var(--hint); margin-top:6px; line-height:1.4; }

.children{ margin-left:var(--indent); }

/* подсказка снизу */
.tip{ position:fixed; left:0; right:0; bottom:0; background:var(--sec-bg); color:var(--hint);
  font-size:12px; text-align:center; padding:8px 12px; line-height:1.4; }

/* lightbox для картинки */
.lb{ position:fixed; inset:0; background:rgba(0,0,0,.85); display:none;
  align-items:center; justify-content:center; padding:20px; z-index:50; cursor:zoom-out; }
.lb.on{ display:flex; }
.lb img{ max-width:100%; max-height:100%; border-radius:8px; }

/* тулбар действий (прилипает сверху при скролле) */
.toolbar{ position:sticky; top:0; z-index:10; background:var(--bg);
  display:flex; gap:8px; padding:10px 0 8px; margin-bottom:4px; }
.toolbar button{ font:inherit; font-size:13px; color:var(--link);
  background:var(--sec-bg); border:none; border-radius:8px;
  padding:7px 12px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
.toolbar button:active{ opacity:.55; }
</style>
</head>
<body>
<div class="toolbar" id="toolbar">
  <button data-act="collapseAll">⊟ свернуть всё</button>
  <button data-act="expandAll">⊞ развернуть всё</button>
</div>
<div id="app"></div>
<div class="tip" id="tip">тап ▸ — свернуть · тап по • — нырнуть в узел · крошки сверху — назад</div>
<div class="lb" id="lb"><img src="" alt=""></div>

<script>
// ── Дерево «злого куска» (personality 15.md, стр 24–43). Текст ДОСЛОВНЫЙ. ──
const TREE = /*__TREE__*/;

// ── Инлайн-разметка Obsidian → HTML (как в PDF: ==hl==, **bold**, стрелки остаются) ──
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function markup(t){
  t = esc(t);
  t = t.replace(/==(.+?)==/g, '<mark>$1</mark>');
  t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/`(.+?)`/g, '<code>$1</code>');
  return t;
}
// Маркер списка как в оригинале: ведущее 'N.' → номер, иначе буллет •
function splitMarker(text){
  const m = text.match(/^(\d+)\.\s+([\s\S]*)$/);
  if(m) return [m[1]+'.', m[2]];
  return ['•', text];
}
function crumbLabel(node){
  let t = node.text.replace(/[=*]/g,'').replace(/^\d+\.\s+/,'');
  return t.length > 22 ? t.slice(0,22).trim()+'…' : t;
}

// ── Навигация по дереву через path (массив индексов) ──
function nodeAt(path){ let n = TREE; for(const i of path) n = n.children[i]; return n; }
const key = path => path.join('.');

const state = {
  root: [],                 // путь до текущего корня zoom ([] = весь конспект)
  collapsed: new Set(),     // ключи свёрнутых узлов
};

// ── Персист состояния (свёрнутые узлы + позиция zoom) между открытиями ──
const LS_KEY = 'conspect_p15_state';
function saveState(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({
    root: state.root, collapsed: [...state.collapsed]
  })); }catch(_){}
}
function loadState(){
  try{ const s = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if(s){ if(Array.isArray(s.root)) state.root = s.root;
           if(Array.isArray(s.collapsed)) state.collapsed = new Set(s.collapsed); }
  }catch(_){}
}

// обойти все узлы-с-детьми под заданным path (для «свернуть всё»)
function eachNodePath(node, path, cb){
  if(!node.children) return;
  node.children.forEach((ch, i) => {
    const p = path.concat(i);
    if(Array.isArray(ch.children) && ch.children.length){ cb(p); eachNodePath(ch, p, cb); }
  });
}
function collapseAll(){
  eachNodePath(nodeAt(state.root), state.root, p => state.collapsed.add(key(p)));
  render();
}
function expandAll(){ state.collapsed.clear(); render(); }

function isTextNode(n){ return typeof n.text === 'string'; }

// рекурсивный рендер поддерева
function renderChildren(node, path){
  if(!node.children) return '';
  let out = '';
  node.children.forEach((ch, i) => {
    const p = path.concat(i);
    if(ch.divider){ out += '<div class="divider"></div>'; return; }
    if(ch.arrow){ out += '<div class="arrow">↓↓↓</div>'; return; }
    if(ch.img){
      out += '<figure class="imgrow"><img src="'+ch.img+'" data-full="'+ch.img+'" alt="img">'
           + '<figcaption>'+esc(ch.caption||'')+'</figcaption></figure>';
      return;
    }
    const hasKids = Array.isArray(ch.children) && ch.children.length > 0;
    const collapsed = state.collapsed.has(key(p));
    const [mk, body] = splitMarker(ch.text);
    const caret = hasKids
      ? '<span class="caret" data-toggle="'+key(p)+'">'+(collapsed?'▸':'▾')+'</span>'
      : '<span class="caret empty">▾</span>';
    const bullet = '<span class="bullet'+(hasKids?' zoomable':'')+'" data-zoom="'+key(p)+'">'+mk+'</span>';
    out += '<div class="row'+(collapsed?' collapsed':'')+'">'
         +   caret + bullet + '<span class="txt">'+markup(body)+'</span>'
         + '</div>';
    if(hasKids && !collapsed){
      out += '<div class="children">'+renderChildren(ch, p)+'</div>';
    }
  });
  return out;
}

function renderCrumbs(){
  if(state.root.length === 0) return '';
  let parts = ['<span class="home" data-crumb="">конспект</span>'];
  let acc = [];
  for(let d=0; d<state.root.length; d++){
    acc = acc.concat(state.root[d]);
    const n = nodeAt(acc);
    parts.push('<span class="c" data-crumb="'+key(acc)+'">'+esc(crumbLabel(n))+'</span>');
  }
  // последний — текущий, не кликаем отдельно (он же заголовок)
  return '<div class="crumbs">'+parts.join('<span class="sep">›</span>')+'</div>';
}

function render(){
  const root = nodeAt(state.root);
  const [, body] = state.root.length ? splitMarker(root.text) : ['', root.text];
  let html = renderCrumbs();
  html += '<div class="root-title">'+markup(body)+'</div>';
  html += renderChildren(root, state.root);
  document.getElementById('app').innerHTML = html;
  // hash для «приватного якоря» на узел
  const h = state.root.length ? '#node='+key(state.root) : '#';
  if(location.hash !== h) history.replaceState(null,'',h);
  saveState();
}

// ── Делегирование кликов ──
document.getElementById('app').addEventListener('click', e => {
  const tog = e.target.closest('[data-toggle]');
  if(tog){ const k = tog.dataset.toggle;
    state.collapsed.has(k) ? state.collapsed.delete(k) : state.collapsed.add(k); render(); return; }
  const zm = e.target.closest('[data-zoom]');
  if(zm){ state.root = zm.dataset.zoom ? zm.dataset.zoom.split('.').map(Number) : []; render(); return; }
  const cr = e.target.closest('[data-crumb]');
  if(cr){ const v = cr.dataset.crumb; state.root = v ? v.split('.').map(Number) : []; render(); return; }
  const img = e.target.closest('.imgrow img');
  if(img){ const lb = document.getElementById('lb'); lb.querySelector('img').src = img.dataset.full; lb.classList.add('on'); }
});
document.getElementById('lb').addEventListener('click', () => document.getElementById('lb').classList.remove('on'));

// кнопки тулбара
document.getElementById('toolbar').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if(!b) return;
  if(b.dataset.act === 'collapseAll') collapseAll();
  else if(b.dataset.act === 'expandAll') expandAll();
});

// восстановление из hash (открытие «нырнувшим» в узел)
function fromHash(){
  const m = location.hash.match(/node=([\d.]+)/);
  if(m){ try{ const p = m[1].split('.').map(Number); nodeAt(p); state.root = p; }catch(_){} }
}

// ── Telegram WebApp init ──
try{ if(window.Telegram && Telegram.WebApp){ Telegram.WebApp.ready(); Telegram.WebApp.expand(); } }catch(_){}

loadState();   // восстановить свёрнутые узлы + позицию zoom
fromHash();    // явный якорь #node= перебивает сохранённую позицию
render();
</script>
</body>
</html>
